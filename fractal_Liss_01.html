<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>3D Лиссажу • Спектр звука</title>

<style>
html, body {
  margin: 0;
  background: black;
  overflow: hidden;
}
canvas {
  width: 100vw;
  height: 100vh;
  display: block;
}
#ui {
  position: fixed;
  left: 12px;
  bottom: 12px;
  font-family: monospace;
  color: #9ff;
}
button {
  margin-right: 8px;
  background: #001818;
  color: #9ff;
  border: 1px solid #0ff;
  padding: 6px 10px;
  cursor: pointer;
}
button:hover {
  background: #003030;
}
</style>
</head>

<body>

<canvas id="gl"></canvas>

<div id="ui">
  <button id="on">🎤 Включить микрофон</button>
  <button id="off">⏸ Выключить микрофон</button><br><br>
  3D Lissajous • Ray Marching<br>
  Цвет = спектр звука
</div>

<script>
/* ============================================================
   1. WEBGL — БАЗА
   ============================================================ */

const canvas = document.getElementById("gl");
const gl = canvas.getContext("webgl");
canvas.width = innerWidth;
canvas.height = innerHeight;

if(!gl) alert("WebGL не поддерживается");

/* ============================================================
   2. ШЕЙДЕРЫ
   ============================================================ */

const vs = `
attribute vec2 pos;
void main(){
  gl_Position = vec4(pos,0.0,1.0);
}
`;

const fs = `
precision highp float;

uniform vec2  uRes;
uniform float uTime;
uniform vec3  uAudio; // x=низкие, y=средние, z=высокие

/* --- Повороты камеры --- */
mat3 rotX(float a){
  float s=sin(a), c=cos(a);
  return mat3(1,0,0, 0,c,-s, 0,s,c);
}
mat3 rotY(float a){
  float s=sin(a), c=cos(a);
  return mat3(c,0,s, 0,1,0, -s,0,c);
}

/* --- Поле Лиссажу --- */
vec3 field(vec3 p){
  float a = 2.0 + uAudio.x * 5.0;
  float b = 3.0 + uAudio.y * 4.0;
  float c = 4.0 + uAudio.z * 6.0;
  return vec3(
    sin(a * p.y),
    sin(b * p.z),
    sin(c * p.x)
  );
}

/* --- Distance Estimation --- */
float DE(vec3 p){
  vec3 z = p;
  float d = 1000.0;

  for(int i=0;i<14;i++){
    z += 0.35 * field(z);
    d = min(d, length(z - p));
  }

  return d - (0.10 + uAudio.x * 0.25);
}

/* --- Нормаль --- */
vec3 normal(vec3 p){
  float e=0.001;
  return normalize(vec3(
    DE(p+vec3(e,0,0))-DE(p-vec3(e,0,0)),
    DE(p+vec3(0,e,0))-DE(p-vec3(0,e,0)),
    DE(p+vec3(0,0,e))-DE(p-vec3(0,0,e))
  ));
}

void main(){
  vec2 uv = (gl_FragCoord.xy - 0.5*uRes)/uRes.y;

  vec3 ro = vec3(0,0,4.5);
  vec3 rd = normalize(vec3(uv,-1.6));
  rd = rotY(uTime*0.25)*rotX(uTime*0.18)*rd;

  float t=0.0;
  float hit=-1.0;

  for(int i=0;i<90;i++){
    vec3 p = ro + rd*t;
    float d = DE(p);
    if(d<0.001){ hit=t; break; }
    t+=d;
    if(t>12.0) break;
  }

  vec3 col = vec3(0);

  if(hit>0.0){
    vec3 p = ro + rd*hit;
    vec3 n = normal(p);
    vec3 l = normalize(vec3(0.4,0.7,0.2));
    float diff = clamp(dot(n,l),0.0,1.0);

    /* --- ЦВЕТ = СПЕКТР --- */
    vec3 spectrumColor = vec3(
      0.3 + uAudio.x*0.8, // НЧ → красный
      0.3 + uAudio.y*0.8, // СЧ → зелёный
      0.4 + uAudio.z*0.9  // ВЧ → синий
    );

    col = spectrumColor * diff * (0.6 + uAudio.y);
  }

  gl_FragColor = vec4(col,1.0);
}
`;

/* ============================================================
   3. КОМПИЛЯЦИЯ
   ============================================================ */

function sh(type,src){
  const s=gl.createShader(type);
  gl.shaderSource(s,src);
  gl.compileShader(s);
  if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))
    console.error(gl.getShaderInfoLog(s));
  return s;
}

const prog=gl.createProgram();
gl.attachShader(prog,sh(gl.VERTEX_SHADER,vs));
gl.attachShader(prog,sh(gl.FRAGMENT_SHADER,fs));
gl.linkProgram(prog);
gl.useProgram(prog);

/* ============================================================
   4. ЭКРАННЫЙ КВАДРАТ
   ============================================================ */

const quad=gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER,quad);
gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([
  -1,-1, 1,-1, -1,1, 1,1
]),gl.STATIC_DRAW);

const pos=gl.getAttribLocation(prog,"pos");
gl.enableVertexAttribArray(pos);
gl.vertexAttribPointer(pos,2,gl.FLOAT,false,0,0);

/* ============================================================
   5. UNIFORMS
   ============================================================ */

const uRes=gl.getUniformLocation(prog,"uRes");
const uTime=gl.getUniformLocation(prog,"uTime");
const uAud=gl.getUniformLocation(prog,"uAudio");

/* ============================================================
   6. АУДИО + УПРАВЛЕНИЕ
   ============================================================ */

let ctx, analyser, src, stream;
let data;
let audio = [0,0,0];
let running=false;

function startMic(){
  if(running) return;
  navigator.mediaDevices.getUserMedia({audio:true}).then(s=>{
    stream=s;
    ctx=new AudioContext();
    analyser=ctx.createAnalyser();
    analyser.fftSize=512;
    src=ctx.createMediaStreamSource(stream);
    src.connect(analyser);
    data=new Uint8Array(analyser.frequencyBinCount);
    running=true;
    audioLoop();
  });
}

function stopMic(){
  if(!running) return;
  stream.getTracks().forEach(t=>t.stop());
  ctx.close();
  running=false;
  audio=[0,0,0];
}

function audioLoop(){
  if(!running) return;
  analyser.getByteFrequencyData(data);

  let l=0,m=0,h=0,lc=0,mc=0,hc=0;
  for(let i=0;i<data.length;i++){
    let v=data[i];
    if(i<data.length*0.15){l+=v;lc++;}
    else if(i<data.length*0.5){m+=v;mc++;}
    else{h+=v;hc++;}
  }

  audio[0]=(l/lc)/255;
  audio[1]=(m/mc)/255;
  audio[2]=(h/hc)/255;

  requestAnimationFrame(audioLoop);
}

document.getElementById("on").onclick=startMic;
document.getElementById("off").onclick=stopMic;

/* ============================================================
   7. РЕНДЕР
   ============================================================ */

function draw(t){
  gl.viewport(0,0,canvas.width,canvas.height);
  gl.clear(gl.COLOR_BUFFER_BIT);

  if(running){
    gl.uniform1f(uTime,t*0.001);
    gl.uniform3f(uAud,audio[0],audio[1],audio[2]);
  }

  gl.uniform2f(uRes,canvas.width,canvas.height);
  gl.drawArrays(gl.TRIANGLE_STRIP,0,4);

  requestAnimationFrame(draw);
}
draw(0);
</script>

</body>
</html>
