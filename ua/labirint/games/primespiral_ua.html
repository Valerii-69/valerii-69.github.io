<canvas id="spiral" width="300" height="300"></canvas> <script> const c=document.getElementById("spiral"),ctx=c.getContext("2d"); function isPrime(n){ if(n<2) return false; for(let i=2;i*i<=n;i++) if(n%i===0) return false; return true; } let x=150,y=150,dx=1,dy=0,step=1,count=0,num=1,limit=1; function stepDraw(){ for(let i=0;i<step;i++){ if(isPrime(num)) ctx.fillRect(x,y,2,2); x+=dx; y+=dy; num++; } count++; if(count%2===0) step++; [dx,dy]=[-dy,dx]; if(num<10000) requestAnimationFrame(stepDraw); } stepDraw(); </script>
