Броуновское движение. Частицы двигаются случайным образом. 
<canvas id="particles" width="300" height="300"></canvas> <script> const canvas=document.getElementById('particles'); const ctx=canvas.getContext('2d'); const N=50; const particles=Array.from({length:N},()=>({x:Math.random()*300,y:Math.random()*300})); function update(){ ctx.clearRect(0,0,300,300); for(const p of particles){ p.x+=Math.random()*4-2; p.y+=Math.random()*4-2; if(p.x<0) p.x=0; if(p.x>300) p.x=300; if(p.y<0) p.y=0; if(p.y>300) p.y=300; ctx.fillRect(p.x,p.y,2,2); } requestAnimationFrame(update); } update(); </script>
