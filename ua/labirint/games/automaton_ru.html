Запустите автомат (правило 30) и наблюдайте, как из хаоса рождаются узоры. 
<canvas id="auto" width="300" height="200"></canvas> <script> const canvas=document.getElementById("auto"); const ctx=canvas.getContext("2d"); let cells=new Array(301).fill(0); cells[150]=1; let row=0; function rule30(l,c,r){ return l^ (c|r); } function draw(){ if(row>=200) return; for(let i=0;i<cells.length;i++){ if(cells[i]) ctx.fillRect(i,row,1,1); } let next=new Array(cells.length).fill(0); for(let i=1;i<cells.length-1;i++){ next[i]=rule30(cells[i-1],cells[i],cells[i+1]); } cells=next; row++; requestAnimationFrame(draw); } draw(); </script>
