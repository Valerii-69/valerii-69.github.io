<canvas id="mandel" width="300" height="200"></canvas> <script> const c=document.getElementById("mandel"),ctx=c.getContext("2d"); function mandelbrot(){ const img=ctx.createImageData(300,200); for(let px=0;px<300;px++){ for(let py=0;py<200;py++){ let x0=(px-200)/100,y0=(py-100)/100,x=0,y=0,iter=0; while(x*x+y*y<=4 && iter<50){ let xt=x*x-y*y+x0; y=2*x*y+y0; x=xt; iter++; } let col=iter==50?0:255-iter*5; let i=(py*300+px)*4; img.data[i]=col; img.data[i+1]=col; img.data[i+2]=col; img.data[i+3]=255; } } ctx.putImageData(img,0,0); } mandelbrot(); </script>
