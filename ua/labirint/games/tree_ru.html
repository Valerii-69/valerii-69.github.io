Рекурсивное бинарное дерево. При клике добавляется новый уровень. 
<canvas id="tree" width="300" height="300"></canvas> <script> const canvas=document.getElementById('tree'); const ctx=canvas.getContext('2d'); let depth=0; function drawTree(x,y,len,angle,level){ if(level===0) return; const x2=x+len*Math.cos(angle), y2=y-len*Math.sin(angle); ctx.beginPath(); ctx.moveTo(x,y); ctx.lineTo(x2,y2); ctx.stroke(); drawTree(x2,y2,len*0.7,angle-Math.PI/6,level-1); drawTree(x2,y2,len*0.7,angle+Math.PI/6,level-1); } function render(){ ctx.clearRect(0,0,300,300); drawTree(150,280,60,Math.PI/2,depth); } canvas.addEventListener('click',()=>{ depth++; render(); }); render(); </script>
