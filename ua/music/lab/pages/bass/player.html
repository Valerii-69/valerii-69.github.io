<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Бас-плеєр — Лабораторія</title>
<style>
/*body { font-family: system-ui, sans-serif; background: #111; color: #eee; margin: 0; padding: 0; }*/

<body>
<header>🎸 Бас-плеєр — Лабораторія</header>
<main>
<section>
<h2>1. Загрузка партитуры</h2> 
<input type="file" id="loadFile" accept=".json"/><br> 
<button id="loadBtn">Вставити партитуру у вікно редактора</button><br> 
<button id="saveBtn">Зберегти власну партитуру</button>
</section>

<розділ> 
<h2>2. Редактирование партитуры</h2> 
<textarea id="dostupNote">
Допустимые ноты:
"C1", "C#1", "D1", "D#1", "E1", "F1",
"F#1", "G1", "G#1", "A1", "A#1", "B1",
"C2", "C#2", "D2", "D#2", "E2", "F2",
"F#2", "G2", "G#2", "A2", "A#2", "B2",
"C3", "C#3", "D3", "D#3", "E3", "F3",
"F#3","G3","G#3","A3","A#3","B3"</textarea> 
<textarea id="partituraText">{ "phrase":["E2","A2","B2","E3","D3","B2","A2","E2"], "tempo":90, "cutoff":213, "drive":0.07, "ratio":8.7, "volume":0.8, "eq":{"low":-1.5,"mid":-11,"high":9.5}, "repeats":4 }</textarea>
</section>

<section>
<h2>3. Воспроизведение и визуализация</h2> 
<div class="controls"> 
<button id="playBtn">▶ Воспроизвести</button> 
<button id="stopBtn">⏹ Стоп</button> 
</div> 
<canvas id="phraseCanvas" width="800" height="60"></canvas> 
<canvas id="spectrumCanvas" width="800" height="150"></canvas>
</section>

<розділ> 
<h2>4. Еквалайзер та ефекти</h2>
<div>
<label>Низькі:</label>
<input type="range" id="lowSlider" min="-15" max="15" step="0.5" value="0">
<span id="lowVal">0</span>дБ
<br>
<label>Середня:</label>
<input type="range" id="midSlider" min="-15" max="15" step="0.5" value="0">
<span id="midVal">0</span>дБ
<br>
<label>Високі:</label>
<input type="range" id="highSlider" min="-15" max="15" step="0.5" value="0">
<span id="highVal">0</span>дБ
</div>
</section>
</main>
<footer>© 2025 — Бас-плеєр</footer>

<script type="module">
// ================== Глобальные переменные ==================
let audioCtx, masterGain, analyser;
let eqNodes = { low:null, mid:null, high:null };
let stopFlag = false;

// ================== Инициализация аудио ==================
function initAudio(){
  if(audioCtx) return;
  audioCtx = new (window.AudioContext||window.webkitAudioContext)();
  masterGain = audioCtx.createGain();
  masterGain.gain.value = 0.8;
  analyser = audioCtx.createAnalyser();
  analyser.fftSize = 1024;

  // EQ цепочка
  eqNodes.low  = audioCtx.createBiquadFilter();
  eqNodes.low.type = "lowshelf";
  eqNodes.low.frequency.value = 200;

  eqNodes.mid  = audioCtx.createBiquadFilter();
  eqNodes.mid.type = "peaking";
  eqNodes.mid.frequency.value = 1000;
  eqNodes.mid.Q.value = 1;

  eqNodes.high = audioCtx.createBiquadFilter();
  eqNodes.high.type = "highshelf";
  eqNodes.high.frequency.value = 5000;

  // Соединяем цепь
  eqNodes.low.connect(eqNodes.mid);
  eqNodes.mid.connect(eqNodes.high);
  eqNodes.high.connect(masterGain);
  masterGain.connect(analyser);
  analyser.connect(audioCtx.destination);
}

// ================== Вспомогательные функции ==================
const noteNames = ["C","C#","D","D#","E","F","F#","G","G#","A","A#","B"];
function noteToFreq(name){
  const m = name.match(/^([A-G]#?)(\d)$/);
  if(!m) return 110;
  const semitone = noteNames.indexOf(m[1]);
  const octave = parseInt(m[2]);
  return 440 * Math.pow(2, (semitone - 9 + (octave - 4)*12)/12);
}

function createTrapezoidWave(ctx,duty=0.4,harm=64){
  const real=new Float32Array(harm+1);
  const imag=new Float32Array(harm+1);
  for(let n=1;n<=harm;n++) imag[n]=(2/(n*Math.PI))*Math.sin(n*Math.PI*duty);
  return ctx.createPeriodicWave(real,imag);
}

// ================== Воспроизведение ==================
async function playPartitura(partitura){
  stopFlag=false;
  initAudio();
  const {phrase,tempo,repeats=1,drive,cutoff,ratio}=partitura;
  const beat=60/(tempo||100);

  // Цепочка эффектов
  const waveShaper = audioCtx.createWaveShaper();
  const k = drive*50;
  const curve = new Float32Array(16384);
  for(let i=0;i<curve.length;i++){
    const x = (i*2)/(curve.length-1)-1;
    curve[i]=Math.tanh((1+k)*x);
  }
  waveShaper.curve=curve;
  waveShaper.oversample='4x';

  const filter = audioCtx.createBiquadFilter();
  filter.type='lowpass';
  filter.frequency.value=cutoff;
  filter.Q.value=0.9;

  const comp = audioCtx.createDynamicsCompressor();
  comp.ratio.value=ratio;
  comp.threshold.value=-24;

  waveShaper.connect(filter);
  filter.connect(comp);
  comp.connect(eqNodes.low);

  const periodic = createTrapezoidWave(audioCtx);

  const gain = audioCtx.createGain();
  gain.gain.setValueAtTime(0.001,audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(1.0,audioCtx.currentTime+0.05);

  for(let r=0;r<repeats && !stopFlag;r++){
    for(let i=0;i<phrase.length && !stopFlag;i++){
      const osc = audioCtx.createOscillator();
      osc.setPeriodicWave(periodic);
      osc.frequency.setValueAtTime(noteToFreq(phrase[i]), audioCtx.currentTime);
      osc.connect(gain).connect(waveShaper);
      osc.start();
      drawPhraseCanvas(phrase,i);
      osc.stop(audioCtx.currentTime+beat*0.9);
      await new Promise(res=>setTimeout(res,beat*1000));
    }
  }
  drawPhraseCanvas(phrase,-1);
}

// ================== Визуализация нот и спектра ==================
function drawPhraseCanvas(phrase, index){
  const c=document.getElementById("phraseCanvas");
  const ctx=c.getContext("2d");
  ctx.clearRect(0,0,c.width,c.height);
  const step=c.width/phrase.length;
  for(let i=0;i<phrase.length;i++){
    ctx.fillStyle=i===index?'orange':'#0af';
    ctx.fillText(phrase[i],i*step+5,30);
    ctx.fillRect(i*step+5,40,step*0.6,4);
  }
}
function visualizeSpectrum(){
  const c=document.getElementById("spectrumCanvas");
  const ctx=c.getContext("2d");
  const data=new Uint8Array(analyser.frequencyBinCount);
  function draw(){
    if(!audioCtx) return;
    requestAnimationFrame(draw);
    analyser.getByteFrequencyData(data);
    ctx.fillStyle="#111";
    ctx.fillRect(0,0,c.width,c.height);
    const barWidth=c.width/data.length;
    for(let i=0;i<data.length;i++){
      const h=data[i]/255*c.height;
      ctx.fillStyle=`rgb(${h+50},50,200)`;
      ctx.fillRect(i*barWidth,c.height-h,barWidth,h);
    }
  }
  draw();
}

// ================== Управление EQ ==================
function setupEQSlider(id,node,spanId){
  const slider=document.getElementById(id);
  const span=document.getElementById(spanId);
  let debounce;
  slider.addEventListener("input",()=>{
    node.gain.value=parseFloat(slider.value);
    clearTimeout(debounce);
    debounce=setTimeout(()=>{span.textContent=slider.value;},30);
  });
}

// ================== Управление ==================
document.getElementById("playBtn").onclick=()=>{
  const part=JSON.parse(document.getElementById("partituraText").value);
  playPartitura(part);
  visualizeSpectrum();
};
document.getElementById("stopBtn").onclick=()=>{stopFlag=true;};
document.getElementById("loadBtn").onclick=()=>{
  const f=document.getElementById("loadFile");
  if(!f.files.length) return alert("Выберите JSON файл!");
  const reader=new FileReader();
  reader.onload=e=>document.getElementById("partituraText").value=e.target.result;
  reader.readAsText(f.files[0]);
};
document.getElementById("saveBtn").onclick=()=>{
  const d=document.getElementById("partituraText").value;
  const blob=new Blob([d],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url; a.download="partitura.json"; a.click();
  URL.revokeObjectURL(url);
};

window.addEventListener("DOMContentLoaded",()=>{
  initAudio();
  setupEQSlider("lowSlider",eqNodes.low,"lowVal");
  setupEQSlider("midSlider",eqNodes.mid,"midVal");
  setupEQSlider("highSlider",eqNodes.high,"highVal");
});
</script>
</body>
</html>
