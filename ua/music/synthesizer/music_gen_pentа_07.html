<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Пентатонічний сон - генератор тризвучних фраз</title>
<style>
body {
  background: radial-gradient(ellipse at center, #050505 0%, #000010 100%);
  color: #e0e0ff;
  font-family: "Trebuchet MS", sans-serif;
  text-align: center;
  margin: 0;
  overflow-x: hidden;
}
canvas {
  width: 100%;
  height: 200px;
  background: transparent;
  display: block;
  margin: 0 auto;
}
.controls {
  display: flex;
  flex-direction: column;
  gap: 8px;
  padding: 10px;
  max-width: 400px;
  margin: auto;
}
input, select, button {
  width: 100%;
  padding: 6px;
  font-size: 1em;
  border-radius: 6px;
  border: none;
}
button {
  background: linear-gradient(90deg,#4e9,#29f);
  color: #fff;
  font-weight: bold;
}
h1 { font-size: 1.3em; margin-top: 10px; }
#toneDisplay { font-size: 1.1em; color: #b0f0ff; margin-bottom: 5px; }
</style>
</head>
<body>
<h1>Пентатонічний сон</h1>
<canvas id="dreamCanvas"></canvas>

<div id="toneDisplay">Тональність: —</div>

<div class="controls"> 
<input id="dreamName" placeholder="Введіть назву сну"> 
<label>Базова нота (пентатоніка): 
<select id="baseNote"> 
<option value="C">C</option> 
<option value="D">D</option> 
<option value="E">E</option> 
<option value="G">G</option> 
<option value="A">A</option> 
</select> 
</label> 
<label>Темп (BPM): <input type="range" id="tempo" min="40" max="180" value="90"></label> 
<label>Crossfade: <input type="range" id="crossfade" min="0.05" max="1" step="0.05" value="0.3"></label> 
<label>Атака: <input type="range" id="attack" min="0.01" max="0.3" step="0.01" value="0.08"></label> 
<label>Загасання: <input type="range" id="release" min="0.05" max="0.5" step="0.01" value="0.15"></label> 
<label>Панорама: <input type="range" id="pan" min="-1" max="1" step="0.1" value="0"></label> 
<button id="generate">Згенерувати сон</button> 
<button id="saveWav">Записати WAV</button>
</div>

<script>
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
const canvas = document.getElementById("dreamCanvas");
const ctx = canvas.getContext("2d");
canvas.width = window.innerWidth;
canvas.height = 200;

// --- Утилита для семени из строки ---
function stringToSeed(str){
  let seed = 0;
  for(let c of str) seed = (seed*31 + c.charCodeAt(0)) >>> 0;
  return seed;
}
function seededRandom(seed){
  return function(){
    seed ^= seed << 13; seed ^= seed >>> 17; seed ^= seed << 5;
    return ((seed >>> 0) % 10000) / 10000;
  };
}

// --- Основная пентатоническая шкала ---
const pentatonic = [0,2,4,7,9]; // интервалы в полутонах

// --- Преобразование названия сна в музыкальные параметры ---
function parseDreamName(name){
  const n = name.trim().toLowerCase();
  const letters = n.length || 1;
  const vowels = (n.match(/[аеёиоуыэюяйaeiouy]/g) || []).length;
  const consonants = letters - vowels;
  const ratio = consonants ? vowels / consonants : 1;
  const seed = stringToSeed(n);
  const rand = seededRandom(seed);

  // Октава зависит от мягкости (гласные/согласные)
  let octaveShift = Math.floor(2 * (ratio - 0.5)); // примерно -1,0,+1
  
  const reverbAmount = 0.25 + 0.5 * Math.min(1, ratio);
  const dreamLength = 3 + (letters % 5);
  const crossfadeTime = 0.2 + 0.02 * letters;
  return {seed, rand, ratio, octaveShift, reverbAmount, dreamLength, crossfadeTime};
}

// --- Преобразование ноты и октавы в частоту ---
function noteToFreq(note, octave){
  const notes = {C:0,'C#':1,D:2,'D#':3,E:4,F:5,'F#':6,G:7,'G#':8,A:9,'A#':10,B:11};
  const base = notes[note];
  return 440 * Math.pow(2, (base - 9 + 12*(octave-4))/12);
}

// --- Генерация звука сна ---
function generateDreamAudio({baseFreq, rand, attack, release, crossfade, pan, tempo, reverbAmount}){
  const sampleRate = audioCtx.sampleRate;
  const beatDur = 60 / tempo;
  const totalDur = beatDur * 8;
  const length = Math.floor(totalDur * sampleRate);
  const buffer = audioCtx.createBuffer(2, length, sampleRate);
  const left = buffer.getChannelData(0);
  const right = buffer.getChannelData(1);

  const noteDur = beatDur * 0.5;
  const numSamples = Math.floor(noteDur * sampleRate);
  const scale = pentatonic.map(x => baseFreq * Math.pow(2, x/12));

  let idx = 0;
  while (idx < length){
    const freq = scale[Math.floor(rand() * scale.length)];
    const amp = 0.4 + 0.3 * rand();
    for (let j=0;j<numSamples && idx<length;j++,idx++){
      const t = j/sampleRate;
      const env = j<numSamples*attack ? j/(numSamples*attack)
               : j>numSamples*(1-release) ? 1-(j-numSamples*(1-release))/(numSamples*release)
               : 1;
      const s = Math.sin(2*Math.PI*freq*t) * amp * env;
      left[idx] = s*(1-pan);
      right[idx] = s*(1+pan);
    }
  }

  // простая реверберация
  const delay = Math.floor(0.15 * sampleRate);
  for(let i=delay;i<length;i++){
    left[i]+=reverbAmount*left[i-delay];
    right[i]+=reverbAmount*right[i-delay];
  }

  return buffer;
}

// --- Воспроизведение с визуализацией ---
function playDream(buffer){
  const source = audioCtx.createBufferSource();
  source.buffer = buffer;
  source.connect(audioCtx.destination);
  source.start();

  // Визуализация
  const analyser = audioCtx.createAnalyser();
  source.connect(analyser);
  analyser.connect(audioCtx.destination);
  const data = new Uint8Array(analyser.frequencyBinCount);
  function draw(){
    requestAnimationFrame(draw);
    analyser.getByteTimeDomainData(data);
    ctx.fillStyle = `rgba(0, 0, 30, 0.25)`;
    ctx.fillRect(0,0,canvas.width,canvas.height);
    ctx.beginPath();
    for(let i=0;i<data.length;i++){
      const x = i/data.length*canvas.width;
      const y = (data[i]/255)*canvas.height;
      ctx.lineTo(x,y);
    }
    ctx.strokeStyle = `hsl(${Date.now()/30%360},100%,70%)`;
    ctx.shadowBlur = 30;
    ctx.shadowColor = ctx.strokeStyle;
    ctx.stroke();
  }
  draw();
}

// --- WAV экспорт ---
function exportWav(buffer){
  const numOfChan = buffer.numberOfChannels;
  const length = buffer.length * numOfChan * 2 + 44;
  const bufferOut = new ArrayBuffer(length);
  const view = new DataView(bufferOut);
  let pos = 0;
  const writeString = s => { for(let i=0;i<s.length;i++) view.setUint8(pos++, s.charCodeAt(i)); };
  const sampleRate = buffer.sampleRate;
  const numFrames = buffer.length;
  writeString('RIFF'); view.setUint32(pos, 36 + numFrames * numOfChan * 2, true); pos += 4;
  writeString('WAVE'); writeString('fmt '); view.setUint32(pos, 16, true); pos += 4;
  view.setUint16(pos, 1, true); pos += 2;
  view.setUint16(pos, numOfChan, true); pos += 2;
  view.setUint32(pos, sampleRate, true); pos += 4;
  view.setUint32(pos, sampleRate * numOfChan * 2, true); pos += 4;
  view.setUint16(pos, numOfChan * 2, true); pos += 2;
  view.setUint16(pos, 16, true); pos += 2;
  writeString('data'); view.setUint32(pos, numFrames * numOfChan * 2, true); pos += 4;
  for(let i=0;i<numFrames;i++){
    for(let ch=0;ch<numOfChan;ch++){
      let sample = buffer.getChannelData(ch)[i]*32767;
      if(sample>32767)sample=32767;
      if(sample<-32768)sample=-32768;
      view.setInt16(pos, sample, true); pos+=2;
    }
  }
  const blob = new Blob([bufferOut], {type: "audio/wav"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "dream.wav";
  a.click();
}

document.getElementById("generate").onclick = async ()=>{
  const name = document.getElementById("dreamName").value || "Безымянный сон";
  const {rand, octaveShift, reverbAmount} = parseDreamName(name);
  const baseNote = document.getElementById("baseNote").value;
  const tempo = +document.getElementById("tempo").value;
  const crossfade = +document.getElementById("crossfade").value;
  const attack = +document.getElementById("attack").value;
  const release = +document.getElementById("release").value;
  const pan = +document.getElementById("pan").value;
  
  const freq = noteToFreq(baseNote, 4 + octaveShift);
  document.getElementById("toneDisplay").textContent = `Тональность: ${baseNote}${4+octaveShift}, темп ${tempo} BPM`;

  const buffer = generateDreamAudio({baseFreq: freq, rand, attack, release, crossfade, pan, tempo, reverbAmount});
  playDream(buffer);

  document.getElementById("saveWav").onclick = ()=>exportWav(buffer);
};
</script>
</body>
</html>
