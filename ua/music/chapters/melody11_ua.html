<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Мелодія 11 — Музика та фрактали</title>
<link rel="stylesheet" href="../style.css">
<style>body{font-family:system-ui;background:#fff8f5;padding:2rem;text-align:center;}button{padding:.5rem 1rem;background:#aa3322;color:white;border:none;border-radius:6px;cursor:pointer;}input{width:60px;margin-left:.5rem;}</style>
</head>
<body>
<h2>Мелодія 11 — Музика та фрактали</h2>
<button id="playBtn">▶ Програти</button>
<label>Темп: <input id="bpm" type="number" value="120" min="30" max="300"></label>
<script>
(function(){
const seq=[60,64,67,72,67,64,60]; // примерная последовательность
const btn=document.getElementById('playBtn');
const bpmInput=document.getElementById('bpm');
let audioCtx=null;
function playSequence(){
if(!audioCtx)audioCtx=new(AudioContext||webkitAudioContext)();
const tempo=Number(bpmInput.value)||120;
const beat=60/tempo;
const startTime=audioCtx.currentTime+0.05;
seq.forEach((note,i)=>{
const freq=440*Math.pow(2,(note-69)/12);
const t=startTime+i*beat;
const osc=audioCtx.createOscillator();
const gain=audioCtx.createGain();
osc.type='sine';
osc.frequency.value=freq;
gain.gain.setValueAtTime(0,t);
gain.gain.linearRampToValueAtTime(0.15,t+0.01);
gain.gain.linearRampToValueAtTime(0,t+beat*0.9);
osc.connect(gain);gain.connect(audioCtx.destination);
osc.start(t);osc.stop(t+beat);
});
}
btn.addEventListener('click',async()=>{
if(!audioCtx)audioCtx=new(AudioContext||webkitAudioContext)();
if(audioCtx.state==='suspended')await audioCtx.resume();
btn.disabled=true;btn.textContent='… проигрывается';
playSequence();
setTimeout(()=>{btn.disabled=false;btn.textContent='▶ Проиграть';},seq.length*(60/(Number(bpmInput.value)||120)*1000));
});
})();
</script>
</body>
</html>
