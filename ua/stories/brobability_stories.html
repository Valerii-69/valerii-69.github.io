<body>

  <header>
    <h2>Занимальна математика з ІІ</h2>
  </header>
  <h1>Філософія і випадок — Історії ймовірності</h1>

  <label for="storySelect">Оберіть історію:</label>
  <select id="storySelect" onchange="showStory()">
    <option value="">-- Оберіть --</option>
    <option value="1">Парадокс днів народження</option>
    <option value="2">Історія з підкиданням монети</option>
    <option value="3">Ймовірність виграшу в лотерею</option>
    <option value="4">Парадокс брехуна</option>
    <option value="5">Болле і випадкові числа</option>
  </select>

  <div class="story-text" id="storyText"></div>

  <iframe src="https://docs.google.com/forms/d/e/1FAIpQLSfAevXddtJDNp7t0u6FlASm9i5zXWQnq3bNIFscj5ZnxTC9YQ/viewform?embedded=true" width="640" height="907" frameborder="0" marginheight="0" marginwidth="0">Завантаження…</iframe>

  <div id="responseMsg"></div>

  <script>
    const stories = {
      1: `Парадокс днів народження:\n\nУ групі всього з 23 людей ймовірність того, що хоча б у двох збігається день народження, перевищує 50%. Це дивно, адже 23 — маленьке число у порівнянні з 365!`,
      2: `Історія з підкиданням монети:\n\nЯкщо підкидати монету багато разів, здається, що результат розподіляється рівномірно. Але після серії орлів люди часто думають, що скоро випаде решка — це називається помилкою гравця.`,
      3: `Ймовірність виграшу в лотерею:\n\nШанси виграти великий джекпот можуть бути 1 до мільйонів. Тим не менш, мільйони людей продовжують грати, сподіваючись на удачу. Багато хто не усвідомлює, наскільки малі ці шанси.`,
      4: `Парадокс брехуна:\n\nЛюдина каже: "Усі мої твердження — хибні." Якщо це правда, значить, він бреше; якщо хиба — значить, говорить правду. Парадокс досліджує логіку та ймовірність істинності висловів.`,
      5: `Болле і випадкові числа:\n\nФізик Болле вивчав випадкові числа та виявив, що вони часто підпорядковуються певним розподілам, що дивно, враховуючи на перший погляд хаотичність подій.`
    };

    function showStory() {
      const select = document.getElementById('storySelect');
      const storyText = document.getElementById('storyText');
      const val = select.value;
      storyText.textContent = val && stories[val] ? stories[val] : '';
      document.getElementById('responseMsg').textContent = '';
    }

    function submitComment() {
      const email = document.getElementById('emailInput').value.trim();
      const comment = document.getElementById('commentInput').value.trim();
      const storyId = document.getElementById('storySelect').value;

      if (!storyId) { alert('Будь ласка, оберіть історію.'); return; }
      if (!comment) { alert('Будь ласка, введіть коментар.'); return; }
      if (!email || !validateEmail(email)) { alert('Будь ласка, введіть правильний email.'); return; }

      fetch('https://script.google.com/macros/s/YOUR_SCRIPT_ID/exec', {
        method: 'POST',
        body: JSON.stringify({ storyId, comment, email }),
        headers: { 'Content-Type': 'application/json' }
      })
      .then(response => response.json())
      .then(data => {
        document.getElementById('responseMsg').textContent =
          data.status === 'ok' ? 'Дякуємо! Ваш коментар надіслано.' : 'Помилка відправки.';
        document.getElementById('commentInput').value = '';
        document.getElementById('emailInput').value = '';
      })
      .catch(() => { document.getElementById('responseMsg').textContent = 'Помилка відправки.'; });
    }

    function validateEmail(email) {
      const re = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
      return re.test(email);
    }
  </script>
