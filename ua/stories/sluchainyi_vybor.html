<h1>Випадковий вибір</h1>
<p>Натисніть кнопку, щоб отримати випадкові думки з розділу «Філософія і випадок».</p>

<button class="btn" onclick="chooseRandom()">Випадковий вибір</button>

<div id="results" class="block"></div>

<script>
const data = {
  "Історії": [
    "Історія про сходи, що ведуть до світанку.",
    "Людина і годинник, що показує лише теперішнє.",
    "Старий, який передбачив програш монети.",
    "Кімната з двома дзеркалами та одними дверима.",
    "Поїзд без розкладу, але завжди вчасно."
  ],
  "Спостереження": [
    "Випадок майже завжди ховається під закономірністю.",
    "Іноді здається, що випадок — це просто нестача даних.",
    "Чим уважніше спостерігаєш за випадковим, тим менше воно здається випадковим."
  ],
  "Есе": [
    "Про те, як випадковість рятує порядок від застою.",
    "Математика ймовірностей як філософія довіри невідомому.",
    "Випадковість як інструмент пошуку сенсу."
  ],
  "Парадокси": [
    "Парадокс передбачуваного випадку.",
    "Парадокс: якщо все випадково, чи закономірна сама випадковість?",
    "Парадокс забутого вибору.",
    "Парадокс оберненої ймовірності.",
    "Парадокс довіри випадковому числу."
  ],
  "Притчі": [
    "Мудрець кинув кості, щоб зрозуміти свою долю.",
    "Учень щодня чекав на випадок. І одного дня випадок став учнем."
  ]
};

function chooseRandom() {
  const resultDiv = document.getElementById("results");
  let output = "";

  for (let category in data) {
    const items = data[category];
    const randomItem = items[Math.floor(Math.random() * items.length)];
    output += `<div class="category-title">${category}:</div><p>${randomItem}</p>`;
  }

  resultDiv.innerHTML = output;
}
</script>
