  <title>Невагомість у ванні</title>
  <style>
    body {
      font-family: sans-serif;
      text-align: center;
    }
    canvas {
      border: 1px solid #555;
      background: #ccf3ff;
    }
  </style>
</head>
<body>
  <h2>Невагомість у ванні</h2>
  <p>Модель тіла у воді з позначенням сил: тяжіння, Архімеда та бічного тиску</p>
  <canvas id="bathCanvas" width="600" height="400"></canvas>

  <script>
    const canvas = document.getElementById("bathCanvas");
    const ctx = canvas.getContext("2d");

    const body = {
      x: 250,
      y: 180,
      width: 100,
      height: 40,
      color: "#ffe0bd"
    };

    const waterLevel = 200;

    function drawScene() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Вода
      ctx.fillStyle = "#aee6f9";
      ctx.fillRect(0, waterLevel, canvas.width, canvas.height - waterLevel);

      // Тіло
      ctx.fillStyle = body.color;
      ctx.fillRect(body.x, body.y, body.width, body.height);

      drawForces();
    }

    function drawArrow(fromX, fromY, toX, toY, color, label) {
      const headlen = 10;
      const dx = toX - fromX;
      const dy = toY - fromY;
      const angle = Math.atan2(dy, dx);

      ctx.beginPath();
      ctx.moveTo(fromX, fromY);
      ctx.lineTo(toX, toY);
      ctx.strokeStyle = color;
      ctx.lineWidth = 2;
      ctx.stroke();

      // Стрілка
      ctx.beginPath();
      ctx.moveTo(toX, toY);
      ctx.lineTo(toX - headlen * Math.cos(angle - Math.PI / 6),
                 toY - headlen * Math.sin(angle - Math.PI / 6));
      ctx.lineTo(toX - headlen * Math.cos(angle + Math.PI / 6),
                 toY - headlen * Math.sin(angle + Math.PI / 6));
      ctx.lineTo(toX, toY);
      ctx.fillStyle = color;
      ctx.fill();

      // Підпис
      ctx.fillStyle = color;
      ctx.font = "16px sans-serif";
      ctx.fillText(label, toX + 5, toY + 5);
    }

    function drawForces() {
      const cx = body.x + body.width / 2;
      const top = body.y;
      const bottom = body.y + body.height;

      drawArrow(cx, top + 10, cx, bottom + 40, "red", "Тяжіння");
      drawArrow(cx - 30, bottom - 10, cx - 30, top - 40, "green", "Архімед");
      drawArrow(body.x + body.width + 5, top + 20, body.x + body.width + 40, top + 20, "blue", "Тиск →");
      drawArrow(body.x - 5, top + 20, body.x - 40, top + 20, "blue", "← Тиск");
    }

    drawScene();
  </script>
</body>
