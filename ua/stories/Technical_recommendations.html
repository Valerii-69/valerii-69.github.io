<h1>6. Технічні рекомендації</h1>
<p>Тут зібрані поради для зручної та безпечної роботи з AI-інструментами та HTML-додатками.</p>

<div id="recommendations"></div>

<button onclick="generateSummary()">Сформувати резюме</button>

<div id="summary"></div>

<script>
const tips = [
  {title:"Чек-лист для перевірки фактів ChatGPT", text:"Порівнюйте з авторитетними джерелами: книги, статті, офіційні сайти."},
  {title:"Упевненість ChatGPT ≠ Істина", text:"Попросіть пояснити крок за кроком або навести приклади."},
  {title:"Логіка ChatGPT", text:"Перевіряйте міркування, повторюйте обчислення самостійно."},
  {title:"Перефразування ChatGPT", text:"Задайте питання іншими словами та порівняйте відповіді."},
  {title:"Нішеві теми ChatGPT", text:"Для вузьких областей перевіряйте через професійні джерела."},
  {title:"Деталі ChatGPT", text:"Перевіряйте цифри, одиниці та терміни."},
  {title:"Інтуїція ChatGPT", text:"Якщо щось здається дивним, зупиніться та подумайте."},
  {title:"Оновлюйте браузер", text:"Використовуйте останню версію Chrome, Firefox або Edge для кращої сумісності з AI-інструментами."},
  {title:"Відкрийте консоль розробника", text:"Використовуйте Ctrl+Shift+I або F12 для перевірки помилок та налагодження JS."},
  {title:"Перевіряйте дозволи", text:"Дозвольте доступ до мікрофона, камери та буфера обміну, якщо потрібно."},
  {title:"Використовуйте надійний інтернет", text:"Більшість AI-інструментів потребує стабільного з’єднання — Wi-Fi кращий за мобільний інтернет."},
  {title:"Зберігайте дані", text:"Регулярно зберігайте текст, код і налаштування, щоб уникнути втрати даних."},
  {title:"Кросбраузерна перевірка", text:"Якщо ділитесь сторінками, перевірте, як вони виглядають у різних браузерах."},
  {title:"Не соромтеся звертатися до ChatGPT", text:"Якщо не можете знайти відповідь онлайн, скопіюйте це посилання https://chatgpt.com/, вставте у браузер і натисніть Enter."}
];

function renderTips() {
  const container = document.getElementById("recommendations");
  tips.forEach((tip, index) => {
    const div = document.createElement("div");
    div.className = "recommendation";
    div.innerHTML = `<h3>${index + 1}. ${tip.title}</h3><p>${tip.text}</p>`;
    container.appendChild(div);
  });
}

function generateSummary() {
  const summary = `
    <strong>Головне:</strong><br>
    ✅ Оновлюйте ПЗ та браузери<br>
    ✅ Перевіряйте консоль на помилки<br>
    ✅ Забезпечте стабільний інтернет<br>
    ✅ Регулярно зберігайте дані<br>
    ✅ Дійте безпечно<br>
    ✅ Перевіряйте сумісність на різних пристроях<br>
    ✅ ChatGPT завжди з ВАМИ!
  `;
  document.getElementById("summary").innerHTML = summary;
}

renderTips();
</script>
