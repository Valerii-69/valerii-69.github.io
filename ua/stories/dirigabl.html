  <title>Ефект Магнуса: циліндр + крило</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <link rel="stylesheet" href="../style.css">
</head>
<body>
  <a href="../oglavlenie.html" class="back-link">&larr; Повернутися до змісту</a><br>
  <div>
<h2>(Будь ласка, встановіть Розширення <a href="https://chromewebstore.google.com/detail/%D0%BF%D0%B5%D1%80%D0%B5%D0%B2%D0%B5%D1%81%D1%82%D0%B8-%D0%B8%D0%B7%D0%BE%D0%B1%D1%80%D0%B0%D0%B6%D0%B5%D0%BD%D0%B8%D0%B5-tra/elnidcpfilmgjnpadcfpihpchjcfdaej?hl=ru&utm_source=ext_sidebar">Translate Image</a>)</h2>
    <img src="../images/magnus_1.png" alt="Модель дирижабля" width="100%"/><br>
    <img src="../images/magnus_2.png" alt="Модель дирижабля" width="100%"/><br>
    <img src="../images/magnus_3.png" alt="Модель дирижабля" width="100%"/><br>
    <img src="../images/dirigabl_1.png" alt="Модель дирижабля" width="100%"/><br>
    <img src="../images/dirigabl_2.png" alt="Модель дирижабля" width="100%"/><br>
  </div>
  <h2>Симуляція: циліндр (ротор Флеттнера) + крило</h2>
  <div class="controls">
    <label>Швидкість вітру (м/с): 
      <input type="range" id="windSpeed" min="1" max="30" step="1" value="10" oninput="updateChart()">
      <span id="windSpeedVal">10</span>
    </label>
    <label>Радіус циліндра (м): 
      <input type="range" id="radius" min="0.1" max="3" step="0.1" value="1" oninput="updateChart()">
      <span id="radiusVal">1</span>
    </label>
    <label>Кутова швидкість (рад/с): 
      <input type="range" id="omega" min="0" max="50" step="1" value="20" oninput="updateChart()">
      <span id="omegaVal">20</span>
    </label>
    <label>Кут крилa (градуси): 
      <input type="range" id="wingAngle" min="-45" max="45" step="1" value="0" oninput="updateChart()">
      <span id="wingAngleVal">0</span>
    </label>
    <button id="start">Старт</button>
  </div>

  <div class="layout">
    <div>
      <canvas id="forceChart" width="400" height="300"></canvas>
      <div class="values">
        <span><b>Fx (подовжня сила):</b> <span id="fxVal">0</span> Н</span>
        <span><b>Fy (бокова сила):</b> <span id="fyVal">0</span> Н</span>
      </div>
    </div>
    <canvas id="animationCanvas" width="400" height="300" style="border:1px solid #ccc;"></canvas>
    <br><a href="../oglavlenie.html" class="back-link">&larr; Повернутися до змісту</a>
  </div>

  <script>
    let el = id => document.getElementById(id);
    let startBtn = el('start');
    const rho = 1.225; 
    const length = 10;

    const ctx = document.getElementById('forceChart').getContext('2d');
    const chart = new Chart(ctx, {
      type: 'bar',
      data: {
        labels: ['Бокова сила (Fy)', 'Подовжня сила (Fx)'],
        datasets: [{ label: 'Сила (Н)', data: [0,0], backgroundColor: ['#3e95cd','#8e5ea2'] }]
      },
      options: { scales: { y: { beginAtZero: true } } }
    });

    const canvas = document.getElementById("animationCanvas");
    const ctxAnim = canvas.getContext("2d");
    let angleRotor = 0;
    let params = { V:10, r:1, omega:20, wingAngle:0 };

    const arrows = [];
    for (let i=0; i<20; i++) arrows.push({ x: Math.random()*canvas.width, y: Math.random()*canvas.height });

    function drawArrow(x, y, size=12) {
      ctxAnim.beginPath();
      ctxAnim.moveTo(x, y);
      ctxAnim.lineTo(x+size, y);
      ctxAnim.lineTo(x+size-4, y-4);
      ctxAnim.moveTo(x+size, y);
      ctxAnim.lineTo(x+size-4, y+4);
      ctxAnim.stroke();
    }

    function drawAnimation() {
      ctxAnim.clearRect(0,0,canvas.width,canvas.height);
      const cx = canvas.width/2;
      const cy = canvas.height/2;
      const R = 50;

      ctxAnim.strokeStyle = "rgba(0,0,0,0.5)";
      arrows.forEach(a => {
        drawArrow(a.x, a.y);
        a.x += params.V*0.3;
        if(a.x>canvas.width+20){ a.x=-20; a.y=Math.random()*canvas.height; }
      });

      ctxAnim.beginPath();
      ctxAnim.arc(cx, cy, R, 0, 2*Math.PI);
      ctxAnim.fillStyle = "#cce5ff";
      ctxAnim.fill();
      ctxAnim.stroke();

      ctxAnim.beginPath();
      ctxAnim.moveTo(cx, cy);
      ctxAnim.lineTo(cx + R*Math.cos(angleRotor), cy + R*Math.sin(angleRotor));
      ctxAnim.strokeStyle = "blue";
      ctxAnim.stroke();

      const wingLen = 60;
      const wingAng = params.wingAngle;
      ctxAnim.save();
      ctxAnim.translate(cx+R+10, cy);
      ctxAnim.rotate(wingAng);
      ctxAnim.fillStyle = "gray";
      ctxAnim.fillRect(0, -10, wingLen, 20);
      ctxAnim.restore();

      const circulation = 2 * Math.PI * params.r * params.r * params.omega;
      const L = rho * params.V * circulation * length;
      const Fx = L * Math.sin(wingAng);
      const Fy = L * Math.cos(wingAng);
      const scale = 0.0005;

      ctxAnim.beginPath();
      ctxAnim.moveTo(cx, cy);
      ctxAnim.lineTo(cx + Fx*scale, cy - Fy*scale);
      ctxAnim.strokeStyle = "red";
      ctxAnim.lineWidth = 2;
      ctxAnim.stroke();

      ctxAnim.fillStyle = "black";
      ctxAnim.fillText("Сила", cx + Fx*scale + 5, cy - Fy*scale);

      angleRotor += params.omega * 0.02;
      requestAnimationFrame(drawAnimation);
    }

    function updateChart() {
      params.V = parseFloat(el('windSpeed').value);
      params.r = parseFloat(el('radius').value);
      params.omega = parseFloat(el('omega').value);
      params.wingAngle = parseFloat(el('wingAngle').value) * Math.PI/180;

      el('windSpeedVal').textContent = params.V;
      el('radiusVal').textContent = params.r.toFixed(1);
      el('omegaVal').textContent = params.omega;
      el('wingAngleVal').textContent = (params.wingAngle*180/Math.PI).toFixed(0);

      const circulation = 2 * Math.PI * params.r * params.r * params.omega;
      const L = rho * params.V * circulation * length;
      const Fx = L * Math.sin(params.wingAngle);
      const Fy = L * Math.cos(params.wingAngle);

      chart.data.datasets[0].data = [Fy, Fx];
      chart.update();

      el('fxVal').textContent = Fx.toFixed(2);
      el('fyVal').textContent = Fy.toFixed(2);
    }

    startBtn.addEventListener('click', ()=>{ updateChart(); drawAnimation(); });
  </script>
</body>
</html>
