<script>
  const content = {
    stories: [
      { title: "Метелик і свічка", text: "Одного вечора, коли світло свічки танцювало на стінах, у кімнату влетів метелик. Він ніжно торкнувся вогню і, немов закохавшись, вирішив залишитися. Світло і темрява змішалися на його крилах, нагадуючи про крихкість миті та красу швидкоплинного." },
      { title: "Аромат часу", text: "Запах старого сиру, що залишився в домі, навіював спогади про забуті дні. Цей аромат був немов містком між минулим і теперішнім, нагадуючи, що час — не лише цифри, а й почуття, запахи й мелодії життя." },
      { title: "Всесвіт коливних частинок", text: "Кожна частинка у космосі безперервно коливається, немов музика Всесвіту звучить на частотах, недоступних нашому слуху. Цей нескінченний танець формує все довкола — від найменших атомів до галактик." },
      { title: "Вітрила і смола", text: "Дитячий паперовий кораблик ковзав по воді, а за ним, не відстаючи, пливла маленька сірник із краплею смоли. Таке просте поєднання сили вітру і хімічної реакції навчало спостерігати реактивний рух і причини, що рухають світом." },
      { title: "Тюльпан-орігамі", text: "Складаючи з паперу тюльпан, ми створюємо не просто квітку, а символ вічної любові та терпіння. Кожен згин — крок у математиці та мистецтві, міст між абстракцією та реальністю." },
      { title: "Білоголовий орел", text: "Коли білоголовий орел одного разу опинився у комунальній квартирі, він побачив світ очима людини й птаха одночасно — простір і свободу, затишок і обмеження. Його політ став метафорою пошуку себе у світі." },
      { title: "Невагомість у ванні", text: "Відчуття невагомості, немов у космосі, виникало у звичайній ванні — коли тіло розслабляється, а вода підтримує кожен рух. Це просте спостереження викликає питання про силу тяжіння і баланс сил у природі." },
      { title: "Історія однієї монети", text: "Якось монета впала ребром. Це тривало два роки..." },
      { title: "Вітер і газета", text: "Газета відлетіла — і змінила життя трьох перехожих..." },
      { title: "Ключ без замка", text: "Старий зберігав ключ усе життя. Тільки замок зник ще в дитинстві..." },
      { title: "Лист у пляшці", text: "Воно допливло. Але адресат не знав, що цей лист — від нього самого." },
      { title: "Сон бібліотекаря", text: "Уві сні він спалював книги, яких не існувало. Вранці вони були у каталозі." },
      { title: "Забутий чемодан", text: "У забутому кутку старого вокзалу стояв потертий чемодан. Його шкіра потріскалася від часу, а застібки вже не блищали, як колись. Чемодан пам’ятав тисячі історій — відпустки, зустрічі й прощання, таємниці й мрії, сховані всередині. Одного дня хтось вирішив узяти його із собою, але невдовзі він знову залишився забутим, немов нагадуючи про те, що кожна історія потребує нового продовження.<p>Питання до читача:</p> Як можна створити метафору подорожі життя через образ забутого чемодана у літературному оповіданні?" },
      { title: "Камінь на вершині", text: "Високо на скелястій вершині лежав самотній камінь. Він був свідком вітрів, дощів і сонячних променів, що змінювали світ навколо. Камінь знав таємниці гір і чув шепіт хмар. Його непорушність була символом терпіння та сили. Кожен, хто піднімався на вершину, знаходив у камені щось більше — відчуття вічності й спокою.<p>Питання до читача:</p> Як можна описати стійкість і незмінність через образ каменя на вершині у поетичному стилі?" },
      { title: "Дзеркало без відображення", text: "У глибині занедбаного будинку стояло дзеркало, яке нічого не відображало. Воно зберігало порожнечу й тишу, немов чекало відповіді на питання, яке ніхто не ставив. Проходячи повз, люди відчували дивне відчуття — ніби дзеркало дивилося в їхні душі, відображаючи не зовнішність, а внутрішні таємниці та мрії.<p>Питання до читача:</p> Як можна використати образ дзеркала без відображення для роздумів про внутрішній світ і самосвідомість?" },
      { title: "Лист від незнайомця", text: "У поштовій скриньці лежав лист без зворотної адреси. Він був написаний від руки, з акуратними літерами та таємничим посланням. Ніхто не знав, хто його надіслав і навіщо. Лист розповідав історію про давно забутого друга, нагадуючи про цінність пам’яті та випадкових зустрічей, що змінюють життя назавжди.<p>Питання до читача:</p> Як можна описати вплив неочікуваних листів на життя людини та їхню роль у долі?" },
      { title: "Втрачена книга", text: "У глибині бібліотеки на запиленій полиці лежала втрачена книга. Її сторінки були зношені, а обкладинка вкрита слідами часу. Ніхто не міг згадати, хто й коли залишив її тут. Ця книга зберігала таємниці й історії, які чекають, щоб хтось знову відкрив її і оживив забуті слова.<p>Питання до читача:</p> Як можна представити втрачену книгу як символ забутої мудрості та можливостей для нового початку?" }
    ],
    observations: [
      { title: "Крапля на склі", text: "Здається випадковою, але її шлях визначає гравітація, пил, нахил і вітер." },
      { title: "Стук у двері", text: "Майже завжди виявляється не тим, кого ми чекаємо. Але змінює хід дня." },
      { title: "Падаючий листок", text: "Кут падіння листка точно співпав з напрямком твого погляду. Випадковість?" }
    ],
    essays: [
      { title: "Випадковість як закон", text: "Чи може випадковість бути результатом вищого порядку? Чи це завжди анархія?" },
      { title: "Філософія кості", text: "Коли грають у кості — чи грає Всесвіт у шахи з нами?" },
      { title: "Можливість неможливого", text: "Що робить рідкісну подію такою значущою у потоці буденного?" },
      { title: "Мої реальні історії", text: "Життя наповнене подіями, які іноді здаються випадковими, але в них завжди прихована закономірність. Спостерігаючи за природою і людьми, я вчуся бачити математичні моделі, що пояснюють навіть найзагадковіші явища." },
      { title: "Філософські нотатки про випадковість і закономірності", text: "Випадковість — не завжди хаос. Іноді вона — прояв глибшої закономірності, недоступної нашому розумінню. Розмірковуючи над цим, ми наближаємося до розуміння суті буття і природи Всесвіту." },
      { title: "Роздуми про природу часу і простору", text: "Час і простір — це не просто тло подій, а активні учасники того, що відбувається. Ми живемо всередині них, і кожна мить — це взаємодія цих величин, наповнена сенсом і загадкою." }
    ],
    paradoxes: [
      { title: "Парадокс передбачення", text: "Якщо передбачення завжди збувається — чому це не випадковість?" },
      { title: "Парадокс часу", text: "Ти випадково не народився раніше, але все би змінилося, якби так." },
      { title: "Парадокс вибору", text: "Здається, ти обираєш випадково. Але хто підсунув варіанти?" },
      { title: "Парадокс помилки", text: "Помилка — випадковість чи закономірність? Чому вона повторюється?" },
      { title: "Парадокс спостерігача", text: "Ти дивишся — і змінюєш те, що, як думаєш, спостерігаєш." },
      { title: "Парадокс «Нескінченний крок»", text: "Як можна зробити нескінченну кількість кроків і все ж опинитися в одному місці? Цей парадокс змушує замислитися про природу нескінченності й про те, як ми сприймаємо простір і рух." },
      { title: "Парадокс «Птах і простір»", text: "Птах летить, здавалося б, вільно, але його траєкторія залежить від безлічі чинників: вітру, обмежень простору і часу. Цей парадокс відображає складність свободи і детермінізму." },
      { title: "Парадокс «Дзеркала і відображення»", text: "Дзеркала показують нам світ, але не сам світ. Відображення — ілюзія реальності, що змушує замислитися над тим, що істинно, а що — лише її тінь." },
      { title: "Парадокси буденної логіки", text: "Дзеркала показують нам світ, але не сам світ. Відображення — ілюзія реальності, що змушує замислитися над тим, що істинно, а що — лише її тінь." }
    ],
    parables: [
      { title: "Притча про вічну любов (танка про тюльпан)", text: "У пелюстках тюльпана прихована історія вічної любові — простої та ніжної, як паперова квітка. Танка нагадує, що любов — це терпіння, увага і вміння цінувати кожну мить." },
      { title: "Притча про коло", text: "Мудрець накреслив коло і сказав: «Це твоя доля». Учень стер одну точку — і пішов." },
      { title: "Притча про випадковість", text: "Біля річки сперечалися Випадок і Закон. Пройшов сліпий. Він не знав, хто з них переміг." },
      { title: "Притча про паперового динозавра і міст", text: "Паперовий динозавр — символ крихкості та сили водночас. Міст, збудований з орігамі, вчить нас, що навіть прості речі можуть поєднувати різні світи і часи." },
      { title: "Притча про білоголового орла і свободу", text: "Свобода — як політ білоголового орла, який одночасно обмежений рамками світу, але прагне до безкрайніх горизонтів. Ця притча про пошук себе і своєї істинної природи." }
    ]
  };

  function createCards(type, items) {
    const container = document.getElementById(type);
    items.forEach((item, index) => {
      const card = document.createElement("div");
      card.className = "card";
      card.innerHTML = `<strong>${item.title}</strong><div class="content">${item.text}</div>`;
      if(type == "paradoxes" && index === 8){card.innerHTML = `<strong>${item.title}</strong><iframe src="../stories/paradoksy_obydennoj_logiki.html" width="600" height="820" frameborder="0" marginheight="0" marginwidth="0">Завантаження…</iframe>`};
      card.addEventListener("click", () => {
        const content = card.querySelector(".content");
        if(content != null){content.style.display = content.style.display === "block" ? "none" : "block";}
      });
      container.appendChild(card);
    });
  }

  createCards("stories", content.stories);
  createCards("observations", content.observations);
  createCards("essays", content.essays);
  createCards("paradoxes", content.paradoxes);
  createCards("parables", content.parables);
</script>
