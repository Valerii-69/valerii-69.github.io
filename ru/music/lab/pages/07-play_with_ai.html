<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Поиграем с ИИ</title>
<style>
 body{background:#071022;color:#e6eef8;font-family:Inter,Arial;margin:0;padding:18px}
 .wrap{max-width:900px;margin:0 auto}
 textarea{width:100%;height:90px;border-radius:8px;padding:8px;border:0;background:rgba(255,255,255,0.03);color:inherit}
 button{padding:8px 10px;border-radius:8px;border:0;background:#7c3aed;color:white;margin-top:8px}
 pre{background:rgba(255,255,255,0.02);padding:10px;border-radius:8px;margin-top:8px}
</style>
</head>
<body>
  <div class="wrap">
    <h1>Поиграем с ИИ</h1>
    <div>Введи тему, и страница выдаст простую мелодическую идею (локально, без реального ИИ — эмуляция на основе слов).</div>
    <textarea id="prompt" placeholder="Например: поле, дождь, старый поезд..."></textarea>
    <button id="go">Сгенерировать мелодию</button>
   <button id="play">Воспроизвести</button>
    <pre id="out"></pre>
  </div>
<script>
   let seq = [];
 const go = document.getElementById('go'); 
 const playBtn = document.getElementById('play'); 
 const out = document.getElementById('out');
  function hashSeed(s){ let h=0; for(let i=0;i<s.length;i++){ h = (h*31 + s.charCodeAt(i))|0; } return Math.abs(h); }
  go.addEventListener('click', ()=>{
    const text = document.getElementById('prompt').value.trim(); if(!text){ alert('Введи тему'); return; }
    const seed = hashSeed(text);
    const rng = x=>{ seedHolder = (seedHolder*1664525 + 1013904223)|0; return Math.abs(seedHolder)/0x7fffffff; };
    // простой LCG с замыканием
    let seedHolder = seed;
    const base = 60 + (seed % 12);
    const scale = [0,2,3,5,7,9,10];
    //const seq = [];
    for(let i=0;i<8;i++){ const r = Math.floor(rng()*scale.length); seq.push(scale[r]); }
    out.textContent = `Базовая нота (MIDI): ${base}\nМелодия (интервалы): ` + seq.join(', ');
  });
     playBtn.addEventListener('click', async ()=>{
    if(!seq.length) return; 
      const ctx = new (window.AudioContext||window.webkitAudioContext)(); 
      let t = ctx.currentTime; 
      for(let s of seq){ const o = ctx.createOscillator(); 
                        const g = ctx.createGain(); 
                        o.type='sine'; 
                        o.frequency.value = 440*Math.pow(2,(60 + s -69)/12); 
                        o.connect(g); 
                        g.connect(ctx.destination); 
                        g.gain.value=0.0001; 
                        o.start(t); 
                        g.gain.linearRampToValueAtTime(0.14, t+0.01); 
                        g.gain.exponentialRampToValueAtTime(0.0001, t+0.22); 
                        o.stop(t+0.28); t += 0.32;
                       }
            seq = [];
     });
</script>
</body>

</html>
