<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Мелодия 10 — Математика созвучий</title>
<link rel="stylesheet" href="../style.css">
<style>body{font-family:system-ui;background:#f0fff8;padding:2rem;text-align:center;}button{padding:.5rem 1rem;background:#33aa33;color:white;border:none;border-radius:6px;cursor:pointer;}input{width:60px;margin-left:.5rem;}</style>
</head>
<body>
<h2>Мелодия 10 — Математика созвучий</h2>
<button id="playBtn">▶ Проиграть</button>
<label>Темп: <input id="bpm" type="number" value="120" min="30" max="300"></label>

<script>
(function(){
const ratios=[[1,1],[3,2],[4,3],[5,4],[5,3],[6,5],[7,4]];
const btn=document.getElementById('playBtn');
const bpmInput=document.getElementById('bpm');
let audioCtx=null;
function playSequence(){
if(!audioCtx)audioCtx=new(AudioContext||webkitAudioContext)();
const tempo=Number(bpmInput.value)||120;
const beat=60/tempo;
const startTime=audioCtx.currentTime+0.05;
ratios.forEach((r,i)=>{
const freq1=440*Math.pow(2,(49-49)/12);
const freq2=freq1*(r[0]/r[1]);
const t=startTime+i*beat;
[r[0],r[1]].forEach(f=>{
const osc=audioCtx.createOscillator();
const gain=audioCtx.createGain();
osc.type='sine';
osc.frequency.value=f===r[0]?freq1:freq2;
gain.gain.setValueAtTime(0,t);
gain.gain.linearRampToValueAtTime(0.15,t+0.01);
gain.gain.linearRampToValueAtTime(0,t+beat*0.9);
osc.connect(gain);gain.connect(audioCtx.destination);
osc.start(t);osc.stop(t+beat);
});
});
}
btn.addEventListener('click',async()=>{
if(!audioCtx)audioCtx=new(AudioContext||webkitAudioContext)();
if(audioCtx.state==='suspended')await audioCtx.resume();
btn.disabled=true;btn.textContent='… проигрывается';
playSequence();
setTimeout(()=>{btn.disabled=false;btn.textContent='▶ Проиграть';},ratios.length*(60/(Number(bpmInput.value)||120)*1000));
});
})();
</script>
</body>
</html>
