<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Мелодия 2 — Путь огня</title>
<link rel="stylesheet" href="../style.css">
<style>
  body{font-family:system-ui;padding:12px;background:#fff7f3;color:#2b1208}
  .card{background:#fff;padding:12px;border-radius:10px;box-shadow:0 8px 20px rgba(0,0,0,0.06)}
  button{padding:8px 10px;border-radius:8px;border:none;cursor:pointer}
  .play{background:#b33000;color:white}
  .stop{background:#aaa;color:#222}
</style>
</head>
<body>
<div class="card">
  <h2>Мелодия 2 — Путь огня</h2>
  <p>Тембр: пила (sawtooth). Последовательность (ритмический паттерн) — [3,6,9,12,9,6,3] с акцентом на каждом первом элементе.</p>
  <div style="display:flex;gap:8px;align-items:center">
    <button id="playBtn" class="play">▶ Проиграть</button>
    <button id="stopBtn" class="stop">■ Стоп</button>
    <label style="margin-left:8px">BPM <input id="bpm" type="number" value="110" min="30" max="300"></label>
  </div>
</div>

<script>
(function(){
  const seq = [3,6,9,12,9,6,3];
  const playBtn = document.getElementById('playBtn'), stopBtn = document.getElementById('stopBtn'), bpmInput = document.getElementById('bpm');
  let audioCtx = null, scheduled = [];
  function valToMidi(v){ return 60 + (v - 1); }
  function midiToFreq(m){ return 440 * Math.pow(2, (m - 69) / 12); }

  function playSeq(){
    const tempo = Number(bpmInput.value) || 110;
    const beat = 60 / tempo;
    const now = audioCtx.currentTime + 0.05;
    seq.forEach((v,i)=>{
      const t = now + i * beat;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      const filter = audioCtx.createBiquadFilter();
      filter.type = 'lowpass';
      filter.frequency.value = 2000 - i*80; // немного тембра по шагам
      osc.type = 'sawtooth';
      osc.frequency.value = midiToFreq(valToMidi(v));
      gain.gain.setValueAtTime(0, t);
      gain.gain.linearRampToValueAtTime(0.22, t + 0.01);
      gain.gain.linearRampToValueAtTime(0.12, t + beat * 0.6);
      gain.gain.linearRampToValueAtTime(0, t + beat);
      osc.connect(filter); filter.connect(gain); gain.connect(audioCtx.destination);
      osc.start(t); osc.stop(t + beat + 0.02);
      scheduled.push(osc);
    });
    // accent: small noise burst at start
    const noiseGain = audioCtx.createGain();
    const bufferSize = 0.2 * audioCtx.sampleRate;
    const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
    const data = buffer.getChannelData(0);
    for (let i = 0; i < bufferSize; i++) data[i] = (Math.random() * 2 - 1) * 0.18;
    const noise = audioCtx.createBufferSource();
    noise.buffer = buffer;
    noise.connect(noiseGain); noiseGain.connect(audioCtx.destination);
    noiseGain.gain.setValueAtTime(0.0001, now);
    noiseGain.gain.exponentialRampToValueAtTime(0.18, now + 0.01);
    noiseGain.gain.exponentialRampToValueAtTime(0.0001, now + 0.12);
    noise.start(now);
    scheduled.push(noise);
  }

  playBtn.addEventListener('click', async ()=>{
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') await audioCtx.resume();
    playSeq();
  });

  stopBtn.addEventListener('click', ()=>{
    scheduled.forEach(s => { try { s.stop(); } catch(e){} });
    scheduled = [];
  });
})();
</script>
</body>
</html>
