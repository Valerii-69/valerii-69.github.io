1. Snow Fractal Model: Koch curve Behavior: when clicked, a new level of the fractal is built
<canvas id="koch" width="200" height="200"></canvas> <script> const canvas=document.getElementById('koch'); const ctx=canvas.getContext('2d'); let level=0; function drawKoch(x1,y1,x2,y2,lvl){ if(lvl===0){ ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke(); return; } const dx=(x2-x1)/3, dy=(y2-y1)/3; const x3=x1+dx, y3=y1+dy; const x5=x1+2*dx, y5=y1+2*dy; const x4=(x3+x5)/2 - Math.sqrt(3)*(y5-y3)/2; const y4=(y3+y5)/2 + Math.sqrt(3)*(x5-x3)/2; drawKoch(x1,y1,x3,y3,lvl-1); drawKoch(x3,y3,x4,y4,lvl-1); drawKoch(x4,y4,x5,y5,lvl-1); drawKoch(x5,y5,x2,y2,lvl-1); } canvas.addEventListener('click',()=>{ level++; ctx.clearRect(0,0,200,200); drawKoch(10,150,190,150,level); }); drawKoch(10,150,190,150,level); </script>
