Намалюйте граф і спробуйте пройти всі ребра, не відриваючи олівець. 
<canvas id="euler" width="300" height="200"></canvas> <script> const canvas=document.getElementById("euler"); const ctx=canvas.getContext("2d"); const nodes=[{x:50,y:100},{x:150,y:50},{x:250,y:100},{x:150,y:150}]; const edges=[[0,1],[1,2],[2,3],[3,0],[0,2],[1,3]]; function drawGraph(){ ctx.clearRect(0,0,300,200); ctx.strokeStyle="black"; edges.forEach(([a,b])=>{ ctx.beginPath(); ctx.moveTo(nodes[a].x,nodes[a].y); ctx.lineTo(nodes[b].x,nodes[b].y); ctx.stroke(); }); ctx.fillStyle="red"; nodes.forEach(n=>ctx.fillRect(n.x-3,n.y-3,6,6)); } drawGraph(); </script>
