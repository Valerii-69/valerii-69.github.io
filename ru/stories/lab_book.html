<head>

<meta name="twitter:card" content="summary_large_image" />

<meta name="twitter:description" content="Исследуем мир математики через увлекательные истории, эксперименты и модели с помощью ИИ." />
<meta name="twitter:image" content="https://valerii-69.github.io/ru/images/og-image.png" />
<title>Разговор с ИИ — Мини-книга</title>
<style>
body { font-family: Arial; background:#fafafa; margin:0; padding:20px; }
h1 { text-align:center; }
.card { background:#fff; border:1px solid #aaa; border-radius:5px; padding:15px; margin:20px auto; max-width:650px; box-shadow:0 4px 8px rgba(0,0,0,0.1);}
.dialogue { border-left:4px solid #4a90e2; padding:10px; margin:10px 0; background:#fefefe; border-radius:5px; }
.dialogue p { margin:5px 0; }
.question { font-weight:bold; color:#2a2a2a; }
.answer { color:#333; margin-left:10px; }
.simulation { border:1px solid #aaa; padding:10px; margin:10px 0; background:#eef; border-radius:5px; }
button { padding:5px 10px; margin:5px; }
.nav { text-align:center; margin:10px 0; }
.bar { height:20px; margin:5px 0; transition:width 0.3s; }
.user-question { margin-top:10px; }
.user-question input { width:80%; padding:5px; }
.user-question button { padding:5px 5px; }
.progress { text-align:center; margin-bottom:10px; font-weight:bold; }
.timeline { display:flex; justify-content:space-between; margin-top:10px; }
.timeline div { text-align:center; flex:1; }
.neuron-grid { display:grid; grid-template-columns:repeat(5,30px); gap:5px; margin-top:10px; }
.neuron { width:30px; height:30px; background:#ddd; border-radius:5px; transition:background 0.3s; }
.raisins { display:flex; justify-content:center; gap:20px; margin-top:10px; }
.raisin { width:20px; height:20px; border-radius:50%; background:brown; position:relative; animation:float 3s infinite ease-in-out; }
@keyframes float {
  0% { transform: translateY(0); }
  50% { transform: translateY(-40px); }
  100% { transform: translateY(0); }
}
.shadow-sim { text-align:center; margin-top:10px; }
</style>
</head>
<body>
  <a href="./literat_math.html" class="back-link">&larr; Вернуться к оглавлению</a>
<h1>Разговор с ИИ — Мини-книга</h1>

<div class="nav">
  <button id="prevBtn">← Предыдущая тема</button>
  <button id="nextBtn">Следующая тема →</button>
</div>
<div class="progress" id="progressIndicator"></div>

<div id="cardContainer"></div>

<script>
// Темы
const dialogues = [
  {
    title:"История GPT",
    blocks:[
      {q:"Когда появился GPT?", a:"Первая версия GPT вышла в 2018 году, затем GPT-2 в 2019, GPT-3 в 2020, GPT-4 в 2023 и GPT-5 в 2024."},
      {q:"Можно показать это как шкалу времени?", a:"Да, смотри интерактив ниже."},
      {simulation:"timeline"}
    ]
  },
  {
    title:"Ломка нейронов",
    blocks:[
      {q:"Что значит «сломать» нейрон?", a:"Это метафора — отдельный узел перестаёт работать, но сеть может сохранять устойчивость."},
      {q:"Можно это смоделировать?", a:"Да, интерактив ниже показывает работу сети при отказах."},
      {simulation:"neurons"}
    ]
  },
  {
    title:"Танцующие изюминки",
    blocks:[
      {q:"Почему изюминки двигаются в газированной воде?", a:"Газовые пузырьки прилипают к изюминке, поднимают её вверх, затем лопаются — и она снова падает вниз."},
      {q:"Можно показать это?", a:"Да, смотри интерактив ниже."},
      {simulation:"raisins"}
    ]
  },
  {
    title:"Тень от карандаша",
    blocks:[
      {q:"Почему тень бывает разной?", a:"Размер и форма тени зависят от угла света и расстояния от источника."},
      {q:"Можно смоделировать тень?", a:"Да, смотри интерактив ниже."},
      {simulation:"shadow"}
    ]
  }
];

let currentIndex = 0;
const container = document.getElementById('cardContainer');
const prevBtn = document.getElementById('prevBtn');
const nextBtn = document.getElementById('nextBtn');
const progressIndicator = document.getElementById('progressIndicator');

function showCard(index){
  container.innerHTML = '';
  const dlg = dialogues[index];
  const card = document.createElement('div');
  card.className = 'card';
  
  const title = document.createElement('h2');
  title.innerText = dlg.title;
  card.appendChild(title);
  
  dlg.blocks.forEach(block=>{
    if(block.simulation){
      const simDiv = document.createElement('div');
      simDiv.className = 'simulation';
      if(block.simulation==="timeline"){
        simDiv.innerHTML = `
          <strong>Эволюция GPT:</strong>
          <div class="timeline">
            <div>2018<br>GPT-1</div>
            <div>2019<br>GPT-2</div>
            <div>2020<br>GPT-3</div>
            <div>2023<br>GPT-4</div>
            <div>2024<br>GPT-5</div>
          </div>
        `;
      }
      if(block.simulation==="neurons"){
        simDiv.innerHTML = `
          <strong>Сеть нейронов:</strong>
          <div class="neuron-grid" id="neuronGrid"></div>
          <button id="breakBtn">Ломать нейроны</button>
        `;
      }
      if(block.simulation==="raisins"){
        simDiv.innerHTML = `
          <strong>Танцующие изюминки:</strong>
          <div class="raisins">
            <div class="raisin" style="animation-delay:0s"></div>
            <div class="raisin" style="animation-delay:0.5s"></div>
            <div class="raisin" style="animation-delay:1s"></div>
          </div>
        `;
      }
      if(block.simulation==="shadow"){
        simDiv.innerHTML = `
          <strong>Симуляция тени:</strong>
          <div class="shadow-sim">
            <label>Угол света: <input type="range" id="angle" min="0" max="90" value="45"></label>
            <div id="shadowBox" style="margin-top:20px; position:relative; height:100px;">
              <div style="width:10px; height:100px; background:black; position:absolute; left:50%;"></div>
              <div id="shadow" style="width:100px; height:10px; background:rgba(0,0,0,0.4); position:absolute; top:100px; left:50%; transform-origin:left;"></div>
            </div>
          </div>
        `;
      }
      card.appendChild(simDiv);

      // Инициализация интерактива
      if(block.simulation==="neurons"){
        const grid = simDiv.querySelector('#neuronGrid');
        for(let i=0;i<25;i++){
          const n = document.createElement('div');
          n.className='neuron';
          grid.appendChild(n);
        }
        const breakBtn = simDiv.querySelector('#breakBtn');
        breakBtn.addEventListener('click',()=>{
          grid.querySelectorAll('.neuron').forEach(n=>{
            if(Math.random()<0.3){ n.style.background='red'; }
            else { n.style.background='limegreen'; }
          });
        });
      }
      if(block.simulation==="shadow"){
        const angleInput = simDiv.querySelector('#angle');
        const shadow = simDiv.querySelector('#shadow');
        angleInput.addEventListener('input',()=>{
          const angle = angleInput.value;
          shadow.style.transform=`rotate(${-angle}deg) scaleX(${1+angle/30})`;
        });
      }

    } else {
      const dlgDiv = document.createElement('div');
      dlgDiv.className = 'dialogue';
      dlgDiv.innerHTML = `<p class="question">Валерий: ${block.q}</p><p class="answer">ИИ: ${block.a}</p>`;
      card.appendChild(dlgDiv);
    }
  });

  // Вопросы посетителей
  const userDiv = document.createElement('div');
  userDiv.className = 'user-question';
  userDiv.innerHTML = `
    <input type="text" id="userInput" placeholder="Задайте вопрос ИИ...">
    <button id="askBtn">Спросить</button>
    <div id="userAnswer" style="margin-top:5px;color:darkblue;"></div>
  `;
  card.appendChild(userDiv);

  const askBtn = userDiv.querySelector('#askBtn');
  const userInput = userDiv.querySelector('#userInput');
  const userAnswer = userDiv.querySelector('#userAnswer');

  askBtn.addEventListener('click', ()=>{
    const question = userInput.value.trim();
    if(question){
      userAnswer.innerText = `ИИ: Это интересный вопрос! Я бы подумал над ним как над новой задачей для анализа.`;
      userInput.value = '';
    }
  });

  container.appendChild(card);
  progressIndicator.innerText = `Тема ${index+1} из ${dialogues.length}`;
}

// Навигация
prevBtn.addEventListener('click', ()=>{
  if(currentIndex > 0){ currentIndex--; showCard(currentIndex); }
});
nextBtn.addEventListener('click', ()=>{
  if(currentIndex < dialogues.length-1){ currentIndex++; showCard(currentIndex); }
});

// Первая карточка
showCard(currentIndex);
</script>
  <a href="./literat_math.html" class="back-link">&larr; Вернуться к оглавлению</a>
</body>
</html>
