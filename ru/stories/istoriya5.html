<body>

<h2>Спичка и смола (click window for refresh)</h2>
<canvas id="lake" width="500" height="300"></canvas>
<!--<div class="caption">🖼️ Место для иллюстрации: детская лодочка, смола, движущаяся спичка</div>-->

<script>
// Получаем контекст канваса
const canvas = document.getElementById("lake");
const ctx = canvas.getContext("2d");

let x = 250; // начальное положение спички
let y = 150;
let vx = 0.5;// + Math.random() * 0.5; // небольшая случайная скорость
let vy = 0.3;
let alpha = 1; // прозрачность "смолы"

function draw() {
  ctx.fillStyle = "lightblue";
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // Рисуем след "реактивной смолы"
  ctx.beginPath();
  ctx.arc(x - vx * 10, y - vy * 10, 8, 0, 2 * Math.PI);
  ctx.fillStyle = `rgba(160, 82, 45, ${alpha})`; // смола (коричневая)
  ctx.fill();

  // Рисуем спичку
  ctx.fillStyle = "brown";
  ctx.fillRect(x - 5, y - 2, 10, 4);

  // Обновляем положение
  x += vx;
  y += vy;
  alpha *= 0.98; // след затухает

  // Отскок от стенок
  if (x < 10 || x > canvas.width - 10) vx *= -1;
  if (y < 10 || y > canvas.height - 10) vy *= -1;

  requestAnimationFrame(draw);
}
canvas.addEventListener('click', function() {
x = 250; // начальное положение спички
y = 150;
//vx = 0.5 + Math.random() * 0.5; // небольшая случайная скорость
//vy = 0.3;
alpha = 1; // прозрачность "смолы"
 draw();
}, false);
//draw();
</script>
