<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Stereo Fractal Visualizer</title>
<style>
body {
margin: 0;
background: #000;
display: flex;
justify-content: center;
align-items: center;
height: 100vh;
gap: 10px;
}
canvas {
width: 680px;
height: 680px;
background: #000;
border: 1px solid #0a0;
}
</style>
</head>
<body>
<div>
<div>
<canvas id="canvasLeft"></canvas>
<canvas id="canvasRight"></canvas>
</div>
<div id="sensitivityPanel" style="
position: fixed;
top: 10px;
right: 10px;
background: rgba(0,0,0,0.6);
padding: 12px;
border-radius: 8px;
color: white;
font-family: sans-serif;
z-index: 9999;
">
<div>Чувствительность полос</div>
<select id="bandSelector" style="width: 100%; margin-top: 6px;">
<option value="0">Полоса 1</option>
<option value="1">Полоса 2</option>
<option value="2">Полоса 3</option>
<option value="3">Полоса 4</option>
<option value="4">Полоса 5</option>
</select>
<input id="gainSlider" type="range" min="0" max="5" step="0.1" value="1"
style="width: 100%; margin-top: 10px;">
<div id="gainValue" style="margin-top: 6px; text-align: center;">x1.0</div>
<div id="modePanel" style="
position: fixed;
top: 150px;
right: 10px;
background: rgba(0,0,0,0.6);
padding: 12px;
border-radius: 8px;
color: white;
font-family: sans-serif;
z-index: 9999;
">
    <div>Режим визуализации</div>
    <select id="modeSelector" style="width: 100%; margin-top: 6px;">
        <option value="audio">Только аудио</option>
        <option value="lissajous">Только Лисажу</option>
        <option value="mix" selected>Смешивание</option>
    </select>
</div>
</div>
<script>
const canvasLeft  = document.getElementById('canvasLeft');
const canvasRight = document.getElementById('canvasRight');
const ctxLeft  = canvasLeft.getContext('2d');
const ctxRight = canvasRight.getContext('2d');
let fractalPoints = [];
let angleY = 0;               // базовый угол вращения
let angleX = 0;               // базовый угол вращения
let angleZ = 0;
let cameraPulse = 0;
let cameraZ = 0;
let spiralAngle = 0;
let spiralRadius = 0;
let m = 0;
let zone_t = 0;
let renderMode = "mix"; 
// варианты: "audio", "lissajous", "mix"

const eyeSeparation = 0.065;   // разница углов между глазами

// Добавляем обработчик клика, чтобы войти в полноэкранный режим
canvasLeft.addEventListener('click', () => {
    if (canvasLeft.requestFullscreen) {
        canvasLeft.requestFullscreen(); // Стандартный API
    } else if (canvasLeft.webkitRequestFullScreen) { // Для старых Safari/Chrome
        canvasLeft.webkitRequestFullScreen();
    } else if (canvasLeft.mozRequestFullScreen) { // Для Firefox
        canvasLeft.mozRequestFullScreen();
    }
});

// Добавляем обработчик клика, чтобы войти в полноэкранный режим
canvasRight.addEventListener('click', () => {
    if (canvasRight.requestFullscreen) {
        canvasRight.requestFullscreen(); // Стандартный API
    } else if (canvasRight.webkitRequestFullScreen) { // Для старых Safari/Chrome
        canvasRight.webkitRequestFullScreen();
    } else if (canvasRight.mozRequestFullScreen) { // Для Firefox
        canvasRight.mozRequestFullScreen();
    }
});


function resizeCanvas() {
canvasLeft.width  = canvasLeft.clientWidth;
canvasLeft.height = canvasLeft.clientHeight;
canvasRight.width  = canvasRight.clientWidth;
canvasRight.height = canvasRight.clientHeight;
}
window.onresize = resizeCanvas;
resizeCanvas();
const sensitivity = [1, 1, 1, 1, 1];
function setSensitivity(band, value) {
sensitivity[band] = value;
console.log("Sens:", sensitivity);
}
const bandSelector = document.getElementById("bandSelector");
const gainSlider = document.getElementById("gainSlider");
const gainValue = document.getElementById("gainValue");
gainSlider.addEventListener("input", () => {
const band = Number(bandSelector.value);
const value = Number(gainSlider.value);
setSensitivity(band, value);
gainValue.textContent = "x" + value.toFixed(1);
});
const modeSelector = document.getElementById("modeSelector");
modeSelector.addEventListener("change", () => {
    renderMode = modeSelector.value;
    console.log("Render mode:", renderMode);
});
let audioCtx;
let analyser;
let fftData;
async function initAudio() {
audioCtx = new (window.AudioContext || window.webkitAudioContext)();
const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
const source = audioCtx.createMediaStreamSource(stream);
analyser = audioCtx.createAnalyser();
analyser.fftSize = 2048;
fftData = new Uint8Array(analyser.frequencyBinCount);
source.connect(analyser);
console.log("Audio init");
}
function getFiveBands() {
if (!analyser || !fftData) return [
{ amp: 0, freq: 0 },
{ amp: 0, freq: 0 },
{ amp: 0, freq: 0 },
{ amp: 0, freq: 0 },
{ amp: 0, freq: 0 },
];
analyser.getByteFrequencyData(fftData);
const bands = [];
const bandSize = Math.floor(fftData.length / 5);
for (let i = 0; i < 5; i++) {
let sum = 0;
let maxAmp = 0;
let maxIndex = 0;
for (let j = 0; j < bandSize; j++) {
const idx = i * bandSize + j;
const v = fftData[idx];
sum += v;
if (v > maxAmp) {
maxAmp = v;
maxIndex = j;
}
}
const avg = sum / bandSize;
const nyquist = audioCtx.sampleRate / 2;
const freq = ((i * bandSize + maxIndex) / fftData.length) * nyquist;
bands.push({ amp: avg * sensitivity[i], freq: freq });
}
return bands;
}
function normalizeDepth(points) {
if (!points || points.length === 0) return;
let max = 0;
for (let p of points) {
if (!p.depth || isNaN(p.depth)) p.depth = 0;
if (p.depth > max) max = p.depth;
}
if (max < 20) {
for (let p of points) {
p.depth = p.depth * 5 + Math.random() * 25;
}
return;
}
if (max === 0) {
for (let i = 0; i < points.length; i++) {
points[i].depth = i * 5 + Math.random() * 5;
}
}
}

// ------------------------------------------------------------
// АУДИО-РЕАКТИВНЫЕ ЛИСАЖУ (две фигуры, вращаются навстречу)
// ------------------------------------------------------------

function generateAudioReactiveLissajous(t, bands) {
    const points = [];
    const N = 400;

    // -----------------------------------------
    // 1. Аудио-параметры
    // -----------------------------------------
    const amp1 = bands[0].amp / 255;   // низкие
    const amp2 = bands[1].amp / 255;   // низ-середина
    const amp3 = bands[2].amp / 255;   // середина
    const amp4 = bands[3].amp / 255;   // верх-середина
    const amp5 = bands[4].amp / 255;   // высокие

    // -----------------------------------------
    // 2. Аудио-реактивные параметры Лисажу
    // -----------------------------------------
    const A = 0.4 + amp1 * 0.6;
    const B = 0.4 + amp2 * 0.6;
    const C = 0.4 + amp3 * 0.6;

    const a = 2 + Math.floor(amp4 * 6);
    const b = 3 + Math.floor(amp5 * 6);
    const c = 4 + Math.floor((amp4 + amp5) * 4);

    const delta1 = 0;
    const delta2 = Math.PI / 2;

    const omega = 0.2 + amp3 * 1.2;

    const theta1 =  omega * t;
    const theta2 = -omega * t;

    // -----------------------------------------
    // 3. Вращение вокруг оси Y
    // -----------------------------------------
    function rotateY(x, y, z, theta) {
        const cosT = Math.cos(theta);
        const sinT = Math.sin(theta);
        return {
            x: x * cosT + z * sinT,
            y: y,
            z: -x * sinT + z * cosT
        };
    }

    // -----------------------------------------
    // 4. Генерация точек
    // -----------------------------------------
    for (let i = 0; i < N; i++) {
        const p = i / N;
        const tt = t + p * Math.PI * 2;

        // Lissajous 1
        let x1 = A * Math.sin(a * tt + delta1);
        let y1 = B * Math.sin(b * tt);
        let z1 = C * Math.sin(c * tt);
        const P1 = rotateY(x1, y1, z1, theta1);

        points.push({
            x: P1.x*0.5,
            y: P1.y*0.5,
            depth: P1.z * 1000,
            size: 1.2 + amp1 * 2,
            color: "#ff66ff"
        });

        // Lissajous 2
        let x2 = A * Math.sin(a * tt + delta2);
        let y2 = B * Math.sin(b * tt);
        let z2 = C * Math.sin(c * tt);
        const P2 = rotateY(x2, y2, z2, theta2);

        points.push({
            x: P2.x*0.5,
            y: P2.y*0.5,
            depth: P2.z * 1000,
            color: "#66ffff",
            size: 1.2 + amp2 * 2
        });
    }

    return points;
}

// ------------------------------------------------------------
// СМЕШИВАНИЕ АУДИО-ФРАКТАЛА И ЛИСАЖУ
// ------------------------------------------------------------

function mixPoints(audioPoints, lissajousPoints, mix) {
    const result = [];

    const maxLen = Math.max(audioPoints.length, lissajousPoints.length);

    for (let i = 0; i < maxLen; i++) {
        const A = audioPoints[i % audioPoints.length];
        const L = lissajousPoints[i % lissajousPoints.length];

        result.push({
            x: A.x * (1 - mix) + L.x * mix,
            y: A.y * (1 - mix) + L.y * mix,
            depth: A.depth * (1 - mix) + L.depth * mix,
            color: mix < 0.5 ? A.color : L.color,
            size: A.size * (1 - mix) + L.size * mix
        });
    }

    return result;
}



function generateFractalPointsFromAudio() {
const bands = getFiveBands();
const points = [];
bands.forEach((band, bandIndex) => {
const { amp, freq } = band;
const normAmp = amp / 255;
const count = 5 + Math.floor(normAmp * 10);
for (let i = 0; i < count; i++) {
const t = i / count;
const angle = t * Math.PI * 2 + bandIndex * 0.5;
const radius = normAmp * (0.3 + bandIndex * 0.15);
let x = Math.cos(angle + freq * 0.00005) * radius;
let y = Math.sin(angle * 1.3 + freq * 0.00003) * radius;
let depth = amp * 0.7 + freq * 0.02 + bandIndex * 5;
let size = 2 + normAmp * 6 + bandIndex * 0.5;
if (isNaN(x)) x = 0;
if (isNaN(y)) y = 0;
if (isNaN(depth)) depth = 0;
if (isNaN(size)) size = 1;
points.push({
x: Number(x.toFixed(3))*1,
y: Number(y.toFixed(3))*1,
depth: Math.round(depth),
color: "#3f0500",
size: Number(size.toFixed(2))
});
}
});
return points.slice(0, 50);
}
async function updateData() {
try {
fractalPoints = generateFractalPointsFromAudio();
normalizeDepth(fractalPoints);
} catch (e) {
console.error("ESP32fetcherror:", e);
}
}
setInterval(updateData, 5);
function drawFractal(ctx, fractalPoints, angleY, angleX, zone_t) {
const canvas = ctx.canvas;
const R =0;
const G = 0;
const B = 0;
ctx.fillStyle = 'rgba('+ R + ', ' + G + ', ' + B + ', 0.1)';
ctx.fillRect(0, 0, canvas.width, canvas.height);
const centerX = canvas.width / 2;
const centerY = canvas.height / 2;
const scale = Math.min(centerX, centerY) * 0.95;
const maxDepth = Math.max(...fractalPoints.map(p => p.depth || 0), 1);
fractalPoints.forEach(point => {
if (!point) return;
let px = point.x * scale;
let py = point.y * scale;
let pz = point.depth !== undefined ? point.depth * 0.5 : 0;
const cosA = Math.cos(angleY);
const sinA = Math.sin(angleY);
const x3d = px * cosA + pz * sinA;
const z3d = pz * cosA - px * sinA;
const perspective = 3 / (1 + z3d * 0.0002);
const X = centerX + x3d * perspective;
const Y = centerY + py * perspective;
const sizeScale = perspective;
const t = point.depth !== undefined
? point.depth / maxDepth
: Math.random();
const zone = t * 6 * zone_t;
const R = Math.floor(128 + 127 * Math.sin(t * Math.PI * 2));
const G = Math.floor(128 + 127 * Math.sin(t * Math.PI * 2 + 2));
const B = Math.floor(128 + 127 * Math.sin(t * Math.PI * 2 + 4));
const color = `rgb(${R}, ${G}, ${B})`;
const canvas = ctx.canvas;
try{
if (zone >0 & zone < 1) {
console.log("zone:" + zone)
const k = zone;
for (let i = 0; i < 6; i++) {
const r = point.size * sizeScale * (3 + i * 1.5) * (0.5 + k);
const alpha = (0.25 / (i + 1)) * k;
ctx.beginPath();
ctx.fillStyle = `rgba(${R}, ${G}, ${B}, ${alpha})`;
ctx.arc(X, Y, r, 0, Math.PI * 2);
ctx.fill();
ctx.shadowColor = point.color;
ctx.shadowBlur = 2;
ctx.fill();
ctx.shadowBlur = 0;
}
} else if (zone >0 & zone < 2) {
const k = zone - 1;
ctx.save();
ctx.translate(X, Y);
for (let i = 0; i < 12; i++) {
ctx.rotate(Math.PI / 6);
const grad = ctx.createLinearGradient(0, 0, point.size * 100 * k * sizeScale, 0);
grad.addColorStop(0, color);
grad.addColorStop(1, "transparent");
ctx.fillStyle = grad;
ctx.fillRect(0, -1, point.size * 100 * k * sizeScale, 2);
}
ctx.restore();
} else if (zone >0 & zone < 3) {
const k = zone - 2;
const sides = Math.floor(3 + k * 3);
const radius = point.size * sizeScale * (2 + k * 7);
ctx.beginPath();
for (let i = 0; i < sides; i++) {
const angle = (i / sides) * Math.PI * 2;
ctx.lineTo(
X + Math.cos(angle) * radius,
Y + Math.sin(angle) * radius
);
}
ctx.closePath();
ctx.fillStyle = color;
ctx.globalAlpha = 0.7;
ctx.fill();
ctx.globalAlpha = 1;
ctx.shadowColor = point.color;
ctx.shadowBlur = 2;
ctx.fill();
ctx.shadowBlur = 0;
} else if (zone >0 & zone < 4) {
const k = zone - 3;
ctx.save();
ctx.translate(X, Y);
const count = Math.floor(5 + k * 25);
const turnsFactor = 0.2;
const radiusFactor = 0.3;
for (let i = 0; i < count; i++) {
const angle = i * turnsFactor;
const r = point.size * sizeScale * (1 + i * radiusFactor * k);
ctx.beginPath();
ctx.fillStyle = `rgba(${R}, ${G}, ${B}, ${1 - i * 0.05})`;
ctx.arc(
Math.cos(angle) * r,
Math.sin(angle) * r,
point.size * k * sizeScale,
0,
Math.PI * 2
);
ctx.fill();
ctx.shadowColor = point.color;
ctx.shadowBlur = 2;
ctx.fill();
ctx.shadowBlur = 0;
}
ctx.restore();
} else if (zone >0 & zone < 5) {
const k = zone - 4;
ctx.beginPath();
ctx.fillStyle = color;
const r = point.size * sizeScale * (1 + k * 2);
ctx.arc(X, Y, r, 0, Math.PI * 2);
ctx.fill();
ctx.shadowColor = point.color;
ctx.shadowBlur = 2;
ctx.fill();
ctx.shadowBlur = 0;
ctx.globalAlpha = k;
ctx.fillRect(X - 1, Y - point.size * 6 * k * sizeScale, 2, point.size * 12 * k * sizeScale);
ctx.fillRect(X - point.size * 6 * k * sizeScale, Y - 1, point.size * 12 * k * sizeScale, 2);
ctx.globalAlpha = 1;
} else if(zone >5){
const k = zone - 5;
const count = Math.floor(2 + k * 6);
angleY += 0.01;
angleX = Math.sin(angleY * 0.3) * 0.15;
angleZ = Math.sin(angleY * 0.5) * 0.1;
cameraPulse = Math.sin(angleY * 0.2) * 0.15;
cameraZ += 0.4;
spiralAngle += 0.02;
spiralRadius = Math.sin(angleY * 0.15) * 40;
}else if(zone == 0){
    // Чистый Лисажу — рисуем простую точку
  ctx.beginPath();
//    ctx.fillStyle = point.color;
	ctx.fillStyle = color; //`rgba(${R}, ${G}, ${B}, ${alpha})`;
    ctx.arc((X), (Y), point.size * sizeScale, 0, Math.PI * 2);
    ctx.fill();
	ctx.shadowColor = point.color;
	ctx.shadowBlur = 10;
	ctx.fill();
	ctx.shadowBlur = 0;
	
}
} catch (error) {
console.error("err:", error.message);
} finally {
console.log("finish");
}
});
}
function animate() {
    angleY += 0;
    angleX += 0;
    m += 0.7;

    // 1. Аудио-фрактал
    const audioPoints = fractalPoints;

    // 2. Лисажу
    const bands = getFiveBands();
    const lissajousPoints = generateAudioReactiveLissajous(m, bands);

    let finalPoints;

    // 3. Выбор режима
    if (renderMode === "audio") {
        finalPoints = audioPoints;
		zone_t = 0.3;
    }
    else if (renderMode === "lissajous") {
        finalPoints = lissajousPoints;
		zone_t = 0;
    }
    else if (renderMode === "mix") {
        const mix = Math.min(1, Math.max(1, bands[1].amp / 255));
        finalPoints = mixPoints(audioPoints, lissajousPoints, mix);
		zone_t = 0.05;
    }

    // 4. Рисуем
    drawFractal(ctxLeft,  finalPoints, angleY - eyeSeparation, angleX - eyeSeparation, zone_t);
    drawFractal(ctxRight, finalPoints, angleY + eyeSeparation, angleX - eyeSeparation, zone_t);

    requestAnimationFrame(animate);
}


window.onload = async () => {
await initAudio();
animate();
};
</script>
</body>
</html>
