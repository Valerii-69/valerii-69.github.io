  <h1>HTML+JS Demo</h1>
  <p>Simulating random numbers from 1 to 10. How often does each number appear?</p>

  <label for="numSimulations">Number of simulations:</label>
  <input type="number" id="numSimulations" value="1000" min="1" max="100000">
  <br>
  <button onclick="runSimulation()">Run Simulation (click multiple times)</button>

  <div id="result"></div>
  <canvas id="chartCanvas" width="600" height="300"></canvas>

  <script>
    function runSimulation() {
      const count = parseInt(document.getElementById('numSimulations').value);
      if (!count || count < 1) {
        alert("Please enter a valid number of simulations.");
        return;
      }

      const frequency = Array(10).fill(0);
      for (let i = 0; i < count; i++) {
        const rand = Math.floor(Math.random() * 10);
        frequency[rand]++;
      }

      const resultDiv = document.getElementById('result');
      resultDiv.innerHTML = `<h3>Results:</h3><ul>${frequency.map((f,i) => `<li>${i+1}: ${f}</li>`).join('')}</ul>`;

      drawChart(frequency);
    }

    function drawChart(data) {
      const canvas = document.getElementById('chartCanvas');
      const ctx = canvas.getContext('2d');
      ctx.clearRect(0,0,canvas.width,canvas.height);

      const max = Math.max(...data);
      const barWidth = canvas.width / data.length;

      data.forEach((value, index) => {
        const height = (value / max) * (canvas.height - 20);
        ctx.fillStyle = '#3f51b5';
        ctx.fillRect(index*barWidth + 10, canvas.height - height - 10, barWidth - 20, height);
        ctx.fillStyle = '#000';
        ctx.fillText(index + 1, index*barWidth + barWidth/2, canvas.height - 2);
      });
    }
  </script>
