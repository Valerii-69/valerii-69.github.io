<script>
  const content = {
    stories: [
      { title: "The Butterfly and the Candle", text: "One evening, as the candlelight danced on the walls, a butterfly entered the room. It gently touched the flame and, as if in love, decided to stay. Light and darkness blended in its wings, reminding us of the fragility of the moment and the beauty of the fleeting." },
      { title: "The Scent of Time", text: "The smell of old cheese left in the house evoked memories of forgotten days. This aroma was like a bridge between past and present, reminding us that time is not only numbers but also feelings, smells, and melodies of life." },
      { title: "The Universe of Swinging Particles", text: "Every particle in the cosmos constantly oscillates, as if the music of the Universe plays on frequencies beyond our hearing. This endless dance shapes everything—from the smallest atoms to galaxies." },
      { title: "Sails and Resin", text: "A child’s paper boat glided on the water, followed closely by a matchstick with a drop of resin. This simple combination of wind power and chemical reaction taught the lesson of reactive motion and the causes that move the world." },
      { title: "Origami Tulip", text: "Folding a tulip from paper, we create not just a flower but a symbol of eternal love and patience. Every fold is a step in mathematics and art, a bridge between abstraction and reality." },
      { title: "The Bald Eagle", text: "When a bald eagle once found itself in a communal apartment, it saw the world through the eyes of both a human and a bird—space and freedom, coziness and limits. Its flight became a metaphor for the search for self in the world." },
      { title: "Weightlessness in the Bathtub", text: "The feeling of weightlessness, as if in space, arose in an ordinary bathtub—when the body relaxed and the water supported every movement. This simple observation raises questions about gravity and balance in nature." },
      { title: "The Story of a Coin", text: "One day a coin landed on its edge. It stayed that way for two years..." },
      { title: "The Wind and the Newspaper", text: "A newspaper flew away—and changed the lives of three passersby..." },
      { title: "A Key without a Lock", text: "An old man kept a key his whole life. But the lock disappeared back in his childhood..." },
      { title: "A Letter in a Bottle", text: "It arrived. But the addressee didn’t know the letter was from himself." },
      { title: "The Librarian’s Dream", text: "In his dream, he burned books that never existed. In the morning they were in the catalog." },
      { title: "The Forgotten Suitcase", text: "In a neglected corner of an old station stood a worn-out suitcase. Its leather cracked with time, and its locks no longer shone as before. The suitcase remembered thousands of stories—holidays, meetings and farewells, secrets and dreams hidden inside. One day someone decided to take it along, but soon the suitcase was left behind again, as if reminding that every story needs a new continuation.<p>Question to the reader:</p> How can the forgotten suitcase be turned into a metaphor of life’s journey in a literary story?" },
      { title: "The Stone on the Summit", text: "High on a rocky peak lay a lonely stone. It had witnessed winds, rains, and sunlight that transformed the world around it. The stone knew the secrets of mountains and heard the whispers of clouds. Its stillness symbolized patience and strength. Everyone who climbed to the summit found in the stone something more—an experience of eternity and peace.<p>Question to the reader:</p> How can stability and permanence be described through the image of a stone on the summit in a poetic style?" },
      { title: "The Mirror without Reflection", text: "In the depths of an abandoned house stood a mirror that reflected nothing. It held emptiness and silence, as if waiting for a question never asked. Passing by, people felt a strange sensation—as if the mirror looked into their souls, reflecting not their appearance but their hidden dreams and secrets.<p>Question to the reader:</p> How can the image of a mirror without reflection be used to reflect on the inner world and self-awareness?" },
      { title: "A Letter from a Stranger", text: "In the mailbox lay a letter without a return address. It was handwritten, with neat letters and a mysterious message. No one knew who sent it or why. The letter told a story of a long-forgotten friend, reminding us of the value of memory and chance encounters that change lives forever.<p>Question to the reader:</p> How can we describe the influence of unexpected letters on human life and their role in fate?" },
      { title: "The Lost Book", text: "On a dusty shelf in the library lay a lost book. Its pages were worn, its cover marked by time. No one could recall who had left it or when. This book kept secrets and stories waiting for someone to reopen it and revive the forgotten words.<p>Question to the reader:</p> How can we present the lost book as a symbol of forgotten wisdom and opportunities for a new beginning?" }
    ],
    observations: [
      { title: "Drop on Glass", text: "It seems random, but its path is determined by gravity, dust, tilt, and wind." },
      { title: "Knock on the Door", text: "Almost always not the person we expect. Yet it changes the course of the day." },
      { title: "Falling Leaf", text: "The angle of a leaf’s fall exactly matched the direction of your gaze. Coincidence?" }
    ],
    essays: [
      { title: "Chance as Law", text: "Can chance be the result of a higher order? Or is it always anarchy?" },
      { title: "Philosophy of Dice", text: "When dice are thrown—is the Universe playing chess with us?" },
      { title: "The Possibility of the Impossible", text: "What makes a rare event so meaningful in the stream of the ordinary?" },
      { title: "My Real Stories", text: "Life is filled with events that may seem random, but there is always a hidden pattern. By observing nature and people, I learn to see mathematical models that explain even the most mysterious phenomena." },
      { title: "Philosophical Notes on Chance and Patterns", text: "Chance is not always chaos. Sometimes it is a manifestation of a deeper order beyond our understanding. Reflecting on this, we approach the essence of being and the nature of the Universe." },
      { title: "Reflections on the Nature of Time and Space", text: "Time and space are not just a backdrop to events but active participants. We live within them, and every moment is an interaction filled with meaning and mystery." }
    ],
    paradoxes: [
      { title: "Paradox of Prediction", text: "If a prediction always comes true—why is it not chance?" },
      { title: "Paradox of Time", text: "You weren’t accidentally born earlier, but everything would have changed if you had." },
      { title: "Paradox of Choice", text: "It seems you choose randomly. But who laid out the options?" },
      { title: "Paradox of Error", text: "Is an error chance or a pattern? Why does it repeat?" },
      { title: "Paradox of the Observer", text: "You look—and change what you think you observe." },
      { title: "Paradox of the Infinite Step", text: "How can one take an infinite number of steps and still remain in one place? This paradox makes us reflect on the nature of infinity and how we perceive space and motion." },
      { title: "Paradox of the Bird and Space", text: "A bird flies seemingly freely, but its path depends on countless factors: wind, limits of space and time. This paradox reflects the complexity of freedom and determinism." },
      { title: "Paradox of Mirrors and Reflections", text: "Mirrors show us the world, but not the world itself. Reflections are illusions of reality, making us wonder what is true and what is only its shadow." },
      { title: "Paradoxes of Everyday Logic", text: "Mirrors show us the world, but not the world itself. Reflections are illusions of reality, making us wonder what is true and what is only its shadow." }
    ],
    parables: [
      { title: "Parable of Eternal Love (Tanka about a Tulip)", text: "In the petals of the tulip lies the story of eternal love—simple and tender, like a paper flower. The tanka reminds us that love is patience, attention, and the ability to value every moment." },
      { title: "Parable of the Circle", text: "A sage drew a circle and said: “This is your fate.” The student erased one point—and left." },
      { title: "Parable of Chance", text: "By the river, Chance and Law argued. A blind man passed by. He didn’t know who had won." },
      { title: "Parable of the Paper Dinosaur and the Bridge", text: "The paper dinosaur is a symbol of fragility and strength at the same time. The bridge built from origami teaches us that even simple things can connect different worlds and times." },
      { title: "Parable of the Bald Eagle and Freedom", text: "Freedom is like the flight of the bald eagle, at once limited by the frames of the world yet striving for endless horizons. This parable is about the search for oneself and one’s true nature." }
    ]
  };

  function createCards(type, items) {
    const container = document.getElementById(type);
    items.forEach((item, index) => {
      const card = document.createElement("div");
      card.className = "card";
      card.innerHTML = `<strong>${item.title}</strong><div class="content">${item.text}</div>`;
      if(type == "paradoxes" && index === 8){card.innerHTML = `<strong>${item.title}</strong><iframe src="../stories/paradoksy_obydennoy_logiki.html" width="600" height="820" frameborder="0" marginheight="0" marginwidth="0">Loading…</iframe>`};
      card.addEventListener("click", () => {
        const content = card.querySelector(".content");
        if(content != null){content.style.display = content.style.display === "block" ? "none" : "block";}
      });
      container.appendChild(card);
    });
  }

  createCards("stories", content.stories);
  createCards("observations", content.observations);
  createCards("essays", content.essays);
  createCards("paradoxes", content.paradoxes);
  createCards("parables", content.parables);
</script>
