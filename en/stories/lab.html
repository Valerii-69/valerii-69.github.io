<script>
const labContainer = document.getElementById('labContainer');
let tID = 1;
function createExperiment(title, description, initFunction, note){
  const block = document.createElement('div');
  block.className = 'experiment-block';
  const h2 = document.createElement('h2'); h2.textContent = title; block.appendChild(h2);
  const p = document.createElement('p'); p.textContent = description; block.appendChild(p);
  const canvas = document.createElement('canvas'); canvas.width=600; canvas.height=400;  canvas.setAttribute('id','AICanvas' + tID);canvas.setAttribute('onclick','startLab(this)'); block.appendChild(canvas);
  const noteDiv = document.createElement('div'); noteDiv.className='note'; noteDiv.innerHTML=note; block.appendChild(noteDiv);
  labContainer.appendChild(block);
  initFunction(canvas);
  tID = tID + 1;
}

function startLab(e){
console.log(e.offsetTop);
if(100 < e.offsetTop && e.offsetTop < 500){let canvas1 = document.getElementById('AICanvas1');initShadow(canvas1);};
if(700 < e.offsetTop && e.offsetTop < 1100){let canvas2 = document.getElementById('AICanvas2');initNetwork(canvas2);};
if(1300 < e.offsetTop && e.offsetTop < 1800){let canvas3 = document.getElementById('AICanvas3');initRaisins(canvas3);};
if(2000 < e.offsetTop && e.offsetTop < 2500){let canvas4 = document.getElementById('AICanvas4');initTowels(canvas4);};
if(2700 < e.offsetTop && e.offsetTop < 3300){let canvas5 = document.getElementById('AICanvas5');initFunction(canvas5);};
};
// ===== 1. Танцующие изюминки с свечением =====
//  const canvas = document.getElementById('labCanvas');

function initRaisins(canvas1){
  const ctx1 = canvas1.getContext('2d'); 
  const raisins=[];
  for(let i=0;i<10;i++){
    raisins.push({x:Math.random()*580, y:Math.random()*380, speed:Math.random()*1+0.5, dir:Math.random()>0.5?1:-1, glow:Math.random()*0.5+0.5});
  }
  function animate(){
    ctx1.clearRect(0,0,600,400);
    for(const r of raisins){
      r.y -= r.speed*r.dir;
      if(r.y<0) r.dir=1; if(r.y>395) r.dir=-1;
      r.glow = 0.5 + 0.5*Math.sin(Date.now()/200 + r.x);
      ctx1.beginPath();
      ctx1.arc(r.x,r.y,7,0,2*Math.PI);
      ctx1.fillStyle=`rgba(139,69,19,${r.glow})`; ctx1.fill();
      ctx1.shadowBlur = 10*r.glow; ctx1.shadowColor = 'orange';
    }
    requestAnimationFrame(animate);
  }
  animate();
}
// ===== 2. Интерактивная нейросеть с подсветкой =====
//  const canvas = document.getElementById('labCanvas');

function initNetwork(canvas2){
  const ctx2 = canvas2.getContext('2d');
  const layers = [
    { x: 100, neurons: 3 },
    { x: 300, neurons: 4 },
    { x: 500, neurons: 2 }
  ]; 
  const neuronRadius = 20; 
  let connections = [];

  function init(){
    connections = [];
    layers.forEach((layer, i) => {
      layer.yPositions = []; 

      if(layer.neurons <= 0){
        console.warn(`Слой ${i} имеет 0 нейронов!`);
        return;
      }

      for(let n = 0; n < layer.neurons; n++){
        if(layer.neurons === 1) layer.yPositions.push(canvas2.height / 2);
        else layer.yPositions.push(50 + n * (canvas2.height - 100) / (layer.neurons - 1));
      }

      // Создаём соединения только если следующий слой существует и имеет нейроны
      if(i < layers.length - 1 && layers[i+1].neurons > 0){
        const next = layers[i + 1];
        next.yPositions = next.yPositions || [];

        for(let n1 = 0; n1 < layer.neurons; n1++){
          for(let n2 = 0; n2 < next.neurons; n2++){
            const fromY = layer.yPositions[n1] !== undefined ? layer.yPositions[n1] : canvas2.height/2;
            const toY = next.yPositions[n2] !== undefined ? next.yPositions[n2] : canvas2.height/2;

            const weight = Math.random() < 0.2 ? Math.random()*0.3+0.1 : Math.random()*0.5+0.5;
            connections.push({
              from: { x: layer.x, y: fromY },
              to: { x: next.x, y: toY },
              weight: weight,
              active: false,
              broken: false
            });
          }
        }
      }
    });
  }

  function draw(){
    ctx2.clearRect(0,0,canvas2.width,canvas2.height);

    connections.forEach(c => {
      ctx2.beginPath(); 
      ctx2.moveTo(c.from.x, c.from.y); 
      ctx2.lineTo(c.to.x, c.to.y);
      if(c.broken){
        ctx2.strokeStyle='rgba(180,180,180,0.4)';
        ctx2.lineWidth=1.5;
      } else {
        ctx2.strokeStyle = c.active ? `rgba(255,0,0,${c.weight})` : `rgba(0,0,0,${c.weight})`;
        ctx2.lineWidth = c.active ? 3 : 1.5;
      }
      ctx2.shadowBlur = c.active ? 8 : 0;
      ctx2.shadowColor = c.active ? 'red' : '';
      ctx2.stroke();
    });

    layers.forEach(layer => layer.yPositions.forEach(y => {
      ctx2.beginPath(); 
      ctx2.arc(layer.x, y, neuronRadius, 0, 2*Math.PI); 
      ctx2.fillStyle = '#004d99'; 
      ctx2.fill(); 
      ctx2.strokeStyle = '#00264d'; 
      ctx2.stroke();
    }));
  }

  canvas2.addEventListener('click', function(e){
    const rect = canvas2.getBoundingClientRect(); 
    const x = e.clientX - rect.left, y = e.clientY - rect.top;
    connections.forEach(c => {
      const dx = c.to.x - c.from.x, dy = c.to.y - c.from.y;
      const length = Math.sqrt(dx*dx + dy*dy);
      const t = ((x - c.from.x)*dx + (y - c.from.y)*dy) / (length*length);
      if(t >= 0 && t <= 1){
        const nx = c.from.x + t*dx, ny = c.from.y + t*dy;
        const dist = Math.sqrt((x - nx)**2 + (y - ny)**2);
        if(dist < 6){ 
          c.broken = !c.broken; 
          draw(); 
        }
      }
    });
  });

  function runSignal(){ 
    connections.forEach(c => c.active = false); 
    let activeConnections = connections.filter(c => !c.broken && Math.random() < c.weight); 
    let index = 0;
    function animate(){ 
      if(index > 0) activeConnections[index-1].active = false; 
      if(index < activeConnections.length){ 
        activeConnections[index].active = true; 
        draw(); 
        index++; 
        requestAnimationFrame(animate); 
      } else draw(); 
    }
    animate();
  }

  init(); 
  draw();

  if(btn2.textContent != 'Give a signal'){
  btn2.textContent = 'Give a signal'; 
  canvas2.parentElement.insertBefore(btn2, canvas2.nextSibling); 
  btn2.onclick = runSignal;
  }
}

// ===== 3. Тень от карандаша с мягким свечением =====
//  const canvas = document.getElementById('labCanvas');

function initShadow(canvas3){
  const ctx3=canvas3.getContext('2d');
  const slider=document.createElement('input'); slider.type='range'; slider.min=10; slider.max=80; slider.value=45; canvas3.parentElement.insertBefore(slider, canvas3.nextSibling);
  const angleDisplay=document.createElement('span'); angleDisplay.textContent='45°'; canvas3.parentElement.insertBefore(angleDisplay, slider.nextSibling);
  function draw(angle){
    ctx3.clearRect(0,0,canvas3.width,canvas3.height); 
    const centerX=300,centerY=350,height=100; 
    const rad=angle*Math.PI/180; const shadowLength=height/Math.tan(rad);
    ctx3.shadowBlur=8; ctx3.shadowColor='rgba(0,0,0,0.3)';
    ctx3.beginPath(); ctx3.moveTo(centerX,centerY); ctx3.lineTo(centerX,centerY-height); ctx3.lineWidth=5; ctx3.strokeStyle='black'; ctx3.stroke();
    ctx3.beginPath(); ctx3.moveTo(centerX,centerY); ctx3.lineTo(centerX+shadowLength,centerY); ctx3.lineWidth=4; ctx3.strokeStyle='rgba(0,0,0,0.5)'; ctx3.stroke();
    ctx3.shadowBlur=0;
  }
  slider.addEventListener('input',()=>{ const angle=parseInt(slider.value); angleDisplay.textContent=angle+'°'; draw(angle); }); draw(45);
}

// ===== 4. Скорость впитывания полотенец с капельками =====
//   const canvas = document.getElementById('labCanvas');

function initTowels(canvas4){
let animID = -1;
  const ctx4=canvas4.getContext('2d'); let progress=0;
  const speedMahro=Math.random()*0.7+0.8; const speedWaffle=Math.random()*0.5+0.5;
  const drops = [];
  for(let i=0;i<20;i++) drops.push({x:50+Math.random()*500, y:Math.random()*-400, speed:Math.random()*2+1, towel:Math.random()>0.5?'mahro':'waffle'});
  
  function animate(){
    ctx4.clearRect(0,0,canvas4.width,canvas4.height);
    drops.forEach(d=>{
      d.y += d.speed;
      if(d.y>canvas4.height-50 && d.towel==='mahro'){ progress+=0.02; d.y=-Math.random()*100; }
      if(d.y>canvas4.height-100 && d.towel==='waffle'){ progress+=0.015; d.y=-Math.random()*100; }
      ctx4.beginPath(); ctx4.arc(d.x,d.y,4,0,2*Math.PI);
      ctx4.fillStyle=d.towel==='mahro'?'red':'blue'; ctx4.fill();
    });
    ctx4.fillStyle='red'; ctx4.fillRect(50,canvas4.height-50,progress*speedMahro*50,30); ctx4.fillStyle='black'; ctx4.fillText('Махровое',50,canvas4.height-60);
    ctx4.fillStyle='blue'; ctx4.fillRect(50,canvas4.height-100,progress*speedWaffle*50,30); ctx4.fillStyle='black'; ctx4.fillText('Вафельное',50,canvas4.height-110);
	var tecXMahro = progress*speedMahro*50;
	var tecXWaffle = progress*speedWaffle*50;
    if((500 - tecXMahro >= 0) && (500 - tecXWaffle >= 0)){
	animID = requestAnimationFrame(animate);
	}else{
	cancelAnimationFrame(animID);
	};
  }
  animate();
}

// ===== Создаем лабораторные работы =====
createExperiment("Pencil Shadow ✏️","Use the slider to change the angle of light and observe the length of the shadow.", initShadow, "🌱 Light and shadow are like knowledge and mistakes: experiment and observe!");
createExperiment("Interactive neural network 🧠", "Click on the line to break or repair the synapse.", initNetwork, "✨ Learn to observe, correct mistakes and see the consequences!");
createExperiment("Dancing raisins 🍇","Click the white rectangle. Watch the raisins «dance» in the soda.", initRaisins, "✨ May your life be filled with as many little miracles as possible!");

function addExperiment(){ alert("The feature adds a new AI lab.");
createExperiment("Absorption rate of towels 💧", "Compare which towel absorbs water faster: terry or waffle.", initTowels, "💧 Experiment, observe and record the results! Small observations lead to big discoveries.");
 const buttonToHide = document.getElementById("newLabAI");
  buttonToHide.style.display = "none";
 }
</script>
