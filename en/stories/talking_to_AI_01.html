<title>Conversation with AI — Mini-Book</title>
<style>
body { font-family: Arial; background:#fafafa; margin:0; padding:20px; }
h1 { text-align:center; }
.card { background:#fff; border:1px solid #aaa; border-radius:5px; padding:15px; margin:20px auto; max-width:600px; box-shadow:0 4px 8px rgba(0,0,0,0.1);}
.dialogue { border-left:4px solid #4a90e2; padding:10px; margin:10px 0; background:#fefefe; border-radius:5px; }
.dialogue p { margin:5px 0; }
.question { font-weight:bold; color:#2a2a2a; }
.answer { color:#333; margin-left:10px; }
.simulation { border:1px solid #aaa; padding:10px; margin:10px 0; background:#eef; border-radius:5px; }
button { padding:5px 10px; margin:5px; }
.nav { text-align:center; margin:10px 0; }
.bar { height:20px; margin:5px 0; transition:width 0.3s; }
.user-question { margin-top:10px; }
.user-question input { width:80%; padding:5px; }
.user-question button { padding:5px 5px; }
.progress { text-align:center; margin-bottom:10px; font-weight:bold; }
</style>
</head>
<body>
  <a href="./literat_math.html" class="back-link">&larr; Back to Contents</a>
<h1>Conversation with AI — Mini-Book</h1>

<div class="nav">
  <button id="prevBtn">← Previous Topic</button>
  <button id="nextBtn">Next Topic →</button>
</div>
<div class="progress" id="progressIndicator"></div>

<div id="cardContainer"></div>

<script>
// Dialogues and topics
const dialogues = [
  {
    title:"Search Optimality",
    blocks:[
      {q:"Can you 'sense' that another path is better?", a:"I do not have a sense of time or experience, so I cannot 'feel' alternative paths."},
      {q:"Is it possible to evaluate search optimality in parallel?", a:"Theoretically, you could create a meta-model evaluating several candidates and selecting the best, but this is not done in real-time."},
      {simulation:true}
    ]
  },
  {
    title:"Meta-Model and Noise",
    blocks:[
      {q:"What is noise level?", a:"Noise simulates randomness and uncertainty in step selection and candidate evaluation."},
      {simulation:true}
    ]
  },
  {
    title:"Time and Steps",
    blocks:[
      {q:"Can execution time of operations be measured?", a:"I can simulate 'time cost' for steps, but do not run real timers."},
      {simulation:true}
    ]
  },
  {
    title:"GPT History",
    blocks:[
      {q:"How did GPT models evolve?", a:"Let's see an interactive timeline from GPT-1 to GPT-5."},
      {history:true}
    ]
  },
  {
    title:"Broken Neurons",
    blocks:[
      {q:"What happens if some synapses fail?", a:"We can simulate a simple network and 'break' a few connections."},
      {brokenNet:true}
    ]
  }
];

let currentIndex = 0;
const container = document.getElementById('cardContainer');
const prevBtn = document.getElementById('prevBtn');
const nextBtn = document.getElementById('nextBtn');
const progressIndicator = document.getElementById('progressIndicator');

function showCard(index){
  container.innerHTML = '';
  const dlg = dialogues[index];
  const card = document.createElement('div');
  card.className = 'card';
  
  const title = document.createElement('h2');
  title.innerText = dlg.title;
  card.appendChild(title);
  
  dlg.blocks.forEach(block=>{
    if(block.simulation){
      const simDiv = document.createElement('div');
      simDiv.className = 'simulation';
      simDiv.innerHTML = `
        <strong>Optimal Path Simulation:</strong>
        <div>
          <label>Noise Level: <input type="range" id="noise" min="0" max="1" step="0.01" value="0.2"></label>
          <button id="runSim">Run</button>
        </div>
        <div style="display:flex; gap:20px; margin-top:10px;">
          <div style="flex:1;">
            <h4>Real Pass</h4>
            <div id="realBar" class="bar" style="background:green;width:0%"></div>
            <div id="realText"></div>
          </div>
          <div style="flex:1;">
            <h4>Meta-Model</h4>
            <div id="modelBar" class="bar" style="background:blue;width:0%"></div>
            <div id="modelText"></div>
            <div id="candidates"></div>
          </div>
        </div>
      `;
      card.appendChild(simDiv);

      const realBar = simDiv.querySelector('#realBar');
      const modelBar = simDiv.querySelector('#modelBar');
      const realText = simDiv.querySelector('#realText');
      const modelText = simDiv.querySelector('#modelText');
      const candidatesDiv = simDiv.querySelector('#candidates');
      const runBtn = simDiv.querySelector('#runSim');
      const noiseInput = simDiv.querySelector('#noise');

      runBtn.addEventListener('click', ()=>{
        const noiseLevel = parseFloat(noiseInput.value);
        const realTime = 1 + Math.random()*noiseLevel;
        realBar.style.width = `${realTime*50}%`;
        realText.innerText = `Time: ${realTime.toFixed(2)}`;
        const candidates = Array.from({length:5}, ()=>1 + Math.random()*noiseLevel);
        candidatesDiv.innerHTML = '';
        let i = 0;
        const best = Math.min(...candidates);
        function nextCandidate(){
          if(i >= candidates.length){
            modelBar.style.width = `${best*50}%`;
            modelText.innerText = `Best: ${best.toFixed(2)} (from ${candidates.map(c=>c.toFixed(2)).join(", ")})`;
            return;
          }
          candidatesDiv.innerHTML = candidates.map((c,j)=>`<div style="margin:3px 0;${j===i?'font-weight:bold;color:limegreen;':''}">Candidate ${j+1}: ${c.toFixed(2)}</div>`).join('');
          i++;
          setTimeout(nextCandidate,500);
        }
        nextCandidate();
      });
    }
    else if(block.history){
      const histDiv = document.createElement('div');
      histDiv.className = 'simulation';
      histDiv.innerHTML = `
        <strong>GPT History:</strong>
        <div style="margin-top:10px;">
          <input type="range" id="gptRange" min="1" max="5" step="1" value="1">
          <span id="gptLabel">GPT-1</span>
          <button id="showHist">Show History</button>
        </div>
        <div id="gptInfo" style="margin-top:10px;color:darkgreen;"></div>
      `;
      card.appendChild(histDiv);

      const gptRange = histDiv.querySelector('#gptRange');
      const gptLabel = histDiv.querySelector('#gptLabel');
      const gptInfo = histDiv.querySelector('#gptInfo');
      const showHist = histDiv.querySelector('#showHist');

      const infos = {
        1:"GPT-1 (2018) — 117M parameters, first step toward a universal transformer.",
        2:"GPT-2 (2019) — 1.5B parameters, able to write coherent text.",
        3:"GPT-3 (2020) — 175B parameters, breakthrough in scaling.",
        4:"GPT-4 (2023) — multimodal, improved accuracy.",
        5:"GPT-5 (2025) — current version, more knowledge, better reasoning."
      };

      gptRange.addEventListener('input',()=>{ gptLabel.innerText = "GPT-"+gptRange.value; });
      showHist.addEventListener('click',()=>{ gptInfo.innerText = infos[gptRange.value]; });
    }
    else if(block.brokenNet){
      const netDiv = document.createElement('div');
      netDiv.className = 'simulation';
      netDiv.innerHTML = `
        <strong>Mini-Network:</strong>
        <canvas id="netCanvas" width="300" height="200" style="border:1px solid #aaa;background:#fff;"></canvas>
        <div>
          <button id="breakBtn">Break Synapse</button>
          <button id="resetBtn">Reset</button>
        </div>
      `;
      card.appendChild(netDiv);

      const canvas = netDiv.querySelector('#netCanvas');
      const ctx = canvas.getContext('2d');
      let broken = false;

      function drawNet(){
        ctx.clearRect(0,0,300,200);
        const nodes = [{x:50,y:100},{x:150,y:50},{x:150,y:150},{x:250,y:100}];
        ctx.fillStyle="black";
        nodes.forEach(n=>{ctx.beginPath();ctx.arc(n.x,n.y,8,0,2*Math.PI);ctx.fill();});
        function connect(a,b,brokenLine=false){
          ctx.beginPath();
          ctx.moveTo(nodes[a].x,nodes[a].y);
          ctx.lineTo(nodes[b].x,nodes[b].y);
          ctx.strokeStyle = brokenLine?"red":"gray";
          ctx.lineWidth=2;
          ctx.stroke();
        }
        connect(0,1,broken);
        connect(0,2,false);
        connect(1,3,false);
        connect(2,3,false);
        ctx.strokeStyle="blue";
        ctx.beginPath();
        ctx.moveTo(50,100);
        if(!broken){ ctx.lineTo(150,50); }
        ctx.lineTo(250,100);
        ctx.stroke();
      }

      drawNet();
      netDiv.querySelector('#breakBtn').addEventListener('click',()=>{broken = true; drawNet();});
      netDiv.querySelector('#resetBtn').addEventListener('click',()=>{broken = false; drawNet();});
    }
    else {
      const dlgDiv = document.createElement('div');
      dlgDiv.className = 'dialogue';
      dlgDiv.innerHTML = `<p class="question">User: ${block.q}</p><p class="answer">AI: ${block.a}</p>`;
      card.appendChild(dlgDiv);
    }
  });

  const userDiv = document.createElement('div');
  userDiv.className = 'user-question';
  userDiv.innerHTML = `
    <input type="text" id="userInput" placeholder="Ask AI a question...">
    <button id="askBtn">Ask</button>
    <div id="userAnswer" style="margin-top:5px;color:darkblue;"></div>
  `;
  card.appendChild(userDiv);

  const askBtn = userDiv.querySelector('#askBtn');
  const userInput = userDiv.querySelector('#userInput');
  const userAnswer = userDiv.querySelector('#userAnswer');

  askBtn.addEventListener('click', ()=>{
    const question = userInput.value.trim();
    if(question){
      userAnswer.innerText = `AI: That's an interesting question! I would think about it as a new analysis task.`;
      userInput.value = '';
    }
  });

  container.appendChild(card);
  progressIndicator.innerText = `Topic ${index+1} of ${dialogues.length}`;
}

prevBtn.addEventListener('click', ()=>{ if(currentIndex > 0){ currentIndex--; showCard(currentIndex);} });
nextBtn.addEventListener('click', ()=>{ if(currentIndex < dialogues.length-1){ currentIndex++; showCard(currentIndex);} });

showCard(currentIndex);
</script>
  <a href="./literat_math.html" class="back-link">&larr; Back to Contents</a>
</body>
</html>
