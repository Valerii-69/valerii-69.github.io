<body>
  <a href="../oglavlenie.html" class="back-link">&larr; Back to Contents</a>
  <h1>Math Story Generator</h1>
  <label for="topicSelect">Select a topic:</label>
  <select id="topicSelect">
    <option value="journey">Time Travel</option>
    <option value="puzzle">Mathematical Puzzle</option>
    <option value="experiment">Scientific Experiment</option>
    <option value="magic">Magic of Numbers</option>
  </select>
  <button id="generateBtn">Create First Story</button>
  <div id="story"></div>
  <button id="againBtn" style="display:none; margin-top:10px;">Create Next Story</button>

  <script>
    const stories = {
      journey: [
        "Once, the hero traveled through time, where every second was measured by golden clocks with unusual geometry. To return home, he had to solve a puzzle based on the number π.",
        "The time traveler discovered an ancient temple built on fractal geometry principles and solved the mystery of infinity using mathematics.",
        "In the distant future, time machines worked on algebraic formulas, and only knowledge of the Pythagorean theorem could open the portal.",
        "A boy ended up in an era where arithmetic did not exist yet and helped people count sheep using number sequences."
      ],
      puzzle: [
        "In a small town appeared a wise man who solved puzzles using only Fibonacci numbers. His hardest puzzle remained unsolved for centuries.",
        "A mathematical puzzle often hides a simple truth: finding patterns in chaos means understanding the world.",
        "On the castle wall, there was an equation that opened the door only for those who could sum infinite series.",
        "A child received a Rubik's cube and discovered that each combination hid its own mathematical pattern."
      ],
      experiment: [
        "In the lab, scientists created a machine that visualized streams of numbers resembling a dance of glowing particles in the dark.",
        "The experiment showed that even random numbers can create amazing patterns if observed carefully.",
        "A young researcher built a telescope that showed graphs of functions instead of stars.",
        "A physicist conducted an experiment and noticed that formulas sometimes predict results more accurately than instruments."
      ],
      magic: [
        "In a faraway land, numbers had magical powers — they could change shape and create amazing patterns that came to life before your eyes.",
        "The wizard of numbers created a spell that allowed understanding the language of nature through equations and formulas.",
        "In the forest stood a magical stone engraved with prime numbers — they protected the land from chaos.",
        "A wizard's apprentice opened a book where spells were written as equations, and every answer came to life before her eyes."
      ]
    };

    const topicSelect = document.getElementById("topicSelect");
    const generateBtn = document.getElementById("generateBtn");
    const storyDiv = document.getElementById("story");
    const againBtn = document.getElementById("againBtn");
    let queues = {};

    function shuffle(array) {
      for (let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
      }
      return array;
    }

    function getNextStory(topic) {
      if (!queues[topic] || queues[topic].length === 0) {
        queues[topic] = shuffle([...stories[topic]]);
      }
      return queues[topic].shift();
    }

    function generateStory() {
      const topic = topicSelect.value;
      const generatedStory = getNextStory(topic);
      storyDiv.textContent = generatedStory;
      againBtn.style.display = "inline-block";
    }

    generateBtn.addEventListener("click", generateStory);
    againBtn.addEventListener("click", generateStory);
  </script>
