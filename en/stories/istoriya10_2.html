  <title>Weightlessness in Water</title>
  <style>
    body { font-family: sans-serif; padding: 2em; background: #f0f9ff; }
    label, input, select { display: block; margin: 0.5em 0; }
    .result { margin-top: 1em; font-weight: bold; color: darkblue; }
  </style>
</head>
<body>
  <h2>🛁 Weightlessness in a Bathtub — Buoyant Force Calculator</h2>
  <label>Body mass (kg): <input type="number" id="mass" value="70"></label><br>
  <label>Body volume (m³): <input type="number" id="volume" value="0.07"></label><br>
  <button onclick="calculate()">Calculate</button>
  <p id="result"></p>

  <script>
    function calculate() {
      const g = 9.8; // gravity
      const rho = 1000; // water density

      const m = parseFloat(document.getElementById('mass').value);
      const V = parseFloat(document.getElementById('volume').value);

      const weight = m * g;
      const buoyancy = rho * V * g;
      const effective = weight - buoyancy;
      const percent = ((effective / weight) * 100).toFixed(1);

      document.getElementById('result').innerHTML =
        `Total weight: ${weight.toFixed(1)} N<br>` +
        `Buoyant force: ${buoyancy.toFixed(1)} N<br>` +
        `Weight in water: ${effective.toFixed(1)} N (${percent}% of normal weight)`;
    }
  </script>
</body>
