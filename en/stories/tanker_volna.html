<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Tanker and Wave</title>
<style>
  body { font-family: Arial; margin: 20px; }
  canvas { border: 1px solid #ccc; display: block; margin-top: 10px; }
  input[type="range"] { width: 300px; }
</style>
</head>
<body>
<h1>Tanker Motion Simulator on Waves</h1>
<h3>To refresh, click on the canvas</h3>
<p>Adjust the wave amplitude and frequency to see how it affects the stability of the tanker.</p>
<label for="amp">Wave Amplitude (m): <span id="amp_val">1.2</span></label>
<input type="range" id="amp" min="0" max="10" value="1.2" step="0.1"><br>
<label for="freq">Wave Frequency (Hz): <span id="freq_val">0.3</span></label>
<input type="range" id="freq" min="0.1" max="6" value="0.3" step="0.1"><br>
<canvas id="tankercanvas" width="600" height="300"></canvas>
<p><b>Tip for the reader:</b> experiment with parameters to find combinations where the tanker loses stability.</p>

<script>
const canvas = document.getElementById('tankercanvas');
const ctx = canvas.getContext('2d');
const ampSlider = document.getElementById('amp');
const freqSlider = document.getElementById('freq');
const ampVal = document.getElementById('amp_val');
const freqVal = document.getElementById('freq_val');

// Update slider labels
function updateLabels() {
  ampVal.textContent = ampSlider.value;
  freqVal.textContent = freqSlider.value;
}
freqSlider.oninput = ampSlider.oninput = updateLabels;
updateLabels();

let t = 0;
function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  const amp = parseFloat(ampSlider.value);
  const freq = parseFloat(freqSlider.value);
  const wave = amp * Math.sin(freq * t);
  const waveT = amp * Math.cos(freq * t);

  ctx.fillStyle = 'blue';
  ctx.fillRect(0, 200 + wave, canvas.width, 200); // water
  ctx.fillStyle = 'gray';
  ctx.fillRect(200, 150 + waveT + 20, 200, 60); // tanker

  t += 0.05;
  requestAnimationFrame(draw);
}

// Restart animation on click
canvas.addEventListener('click', () => { t = 0; draw(); }, false);
draw();
</script>
</body>
</html>
