<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Weightlessness in a Bathtub</title>
  <style>
    canvas {
      border: 1px solid black;
      background-color: #e0f7ff;
      display: block;
      margin: 20px auto;
    }
    body {
      font-family: sans-serif;
      text-align: center;
    }
  </style>
</head>
<body>
  <h2>Weightlessness in a Bathtub: Force Model (click window to refresh)</h2>
  <canvas id="bathCanvas" width="500" height="440"></canvas>

  <script>
    const canvas = document.getElementById('bathCanvas');
    const ctx = canvas.getContext('2d');

    const g = 9.8;
    const waterLevel = 300;
    const bodyWidth = 80;
    const bodyHeight = 40;

    let body = {
      x: 210,
      y: 100,
      vy: 0,
      density: 600,
      volume: 0.032,
      mass: 0.032 * 600,
      color: 'orange'
    };

    const waterDensity = 1000;

    function drawBath() {
      ctx.fillStyle = '#b3e5fc';
      ctx.fillRect(0, waterLevel, canvas.width, canvas.height - waterLevel);
    }

    function drawBody() {
      ctx.fillStyle = body.color;
      ctx.fillRect(body.x, body.y, bodyWidth, bodyHeight);

      const centerX = body.x + bodyWidth / 2;
      const centerY = body.y + bodyHeight / 2;

      drawArrow(centerX, centerY, centerX, centerY + 50, 'red', 'mg'); // gravity
      drawArrow(centerX, centerY, centerX, centerY - 50, 'blue', 'F_b'); // buoyancy

      if (body.y + bodyHeight >= waterLevel + 80) {
        drawArrow(centerX, centerY, centerX, centerY - 30, 'green', 'N'); // normal reaction
      }
    }

    function drawArrow(x1, y1, x2, y2, color, label) {
      ctx.strokeStyle = color;
      ctx.fillStyle = color;
      ctx.lineWidth = 2;

      ctx.beginPath();
      ctx.moveTo(x1, y1);
      ctx.lineTo(x2, y2);
      ctx.stroke();

      let angle = Math.atan2(y2 - y1, x2 - x1);
      ctx.beginPath();
      ctx.moveTo(x2, y2);
      ctx.lineTo(x2 - 5 * Math.cos(angle - Math.PI / 6), y2 - 5 * Math.sin(angle - Math.PI / 6));
      ctx.lineTo(x2 - 5 * Math.cos(angle + Math.PI / 6), y2 - 5 * Math.sin(angle + Math.PI / 6));
      ctx.closePath();
      ctx.fill();

      ctx.fillText(label, x2 + 5, y2 + 5);
    }

    function updatePhysics() {
      const gravity = body.mass * g;
      const buoyancy = waterDensity * g * body.volume;

      let netForce = buoyancy - gravity;

      const bottom = waterLevel + 80;
      if (body.y + bodyHeight >= bottom && netForce > 0) {
        netForce = 0;
        body.vy = 0;
        body.y = bottom - bodyHeight;
      }

      const acceleration = netForce / body.mass;
      body.vy += acceleration * 0.1;
      body.y += body.vy;

      if (body.y < 0) {
        body.y = 0;
        body.vy = 0;
      }
    }

    function loop() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      drawBath();
      updatePhysics();
      drawBody();
      requestAnimationFrame(loop);
    }

    canvas.addEventListener('click', function() {
      body = {
        x: 210,
        y: 100,
        vy: 0,
        density: 600,
        volume: 0.032,
        mass: 0.032 * 600,
        color: 'orange'
      };
      loop();
    }, false);
  </script>
</body>
</html>
