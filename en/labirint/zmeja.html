<title>Симуляция движения змеи</title>
<style>
body { font-family: Arial, sans-serif; background:#f0f0f5; padding:20px; text-align:center;}
canvas { border:1px solid #ccc; background:#fff; display:block; margin:0 auto; }
label { margin:0 10px; font-size:14px; }
input[type=range] { width:150px; }
</style>
</head>
<body>

<h2>Snake Motion Simulation</h2>
<canvas id="snakeCanvas" width="800" height="200"></canvas>

<div style="margin-top:15px;">
<label>Amplitude: <span id="ampVal">20</span></label>
<input type="range" id="amplitude" min="5" max="50" value="20">

<label>Wavelength: <span id="waveVal">100</span></label>
<input type="range" id="wavelength" min="50" max="200" value="100">

<label>Speed: <span id="speedVal">2</span></label>
<input type="range" id="speed" min="1" max="5" value="2">
</div>

<script>
const canvas = document.getElementById("snakeCanvas");
const ctx = canvas.getContext("2d");
const width = canvas.width;
const height = canvas.height;

const segments = 50; // количество сегментов змеи
let time = 0;

let amplitude = parseFloat(document.getElementById("amplitude").value);
let wavelength = parseFloat(document.getElementById("wavelength").value);
let speed = parseFloat(document.getElementById("speed").value);

document.getElementById("amplitude").addEventListener("input", e=>{
  amplitude = parseFloat(e.target.value);
  document.getElementById("ampVal").innerText = amplitude;
});
document.getElementById("wavelength").addEventListener("input", e=>{
  wavelength = parseFloat(e.target.value);
  document.getElementById("waveVal").innerText = wavelength;
});
document.getElementById("speed").addEventListener("input", e=>{
  speed = parseFloat(e.target.value);
  document.getElementById("speedVal").innerText = speed;
});

function drawSnake() {
  ctx.clearRect(0,0,width,height);
  ctx.beginPath();
  for (let i=0;i<segments;i++){
    let x = i * (width/segments);
    let y = height/2 + amplitude * Math.sin(2*Math.PI*(x/wavelength - time));
    if (i===0) ctx.moveTo(x,y);
    else ctx.lineTo(x,y);
  }
  ctx.strokeStyle = "green";
  ctx.lineWidth = 6;
  ctx.lineCap = "round";
  ctx.stroke();
}

function animate() {
  time += 0.02 * speed;
  drawSnake();
  requestAnimationFrame(animate);
}

animate();
</script>
</body>
</html>
