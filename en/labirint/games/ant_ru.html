Муравей Лэнгтона рисует замысловатый путь по клеткам. 
<canvas id="ant" width="300" height="200"></canvas> <script> const canvas=document.getElementById("ant"); const ctx=canvas.getContext("2d"); let grid={},x=150,y=100,dir=0; function step(){ let key=x+","+y; grid[key]=!grid[key]; ctx.fillStyle=grid[key]?"black":"white"; ctx.fillRect(x,y,2,2); dir=(dir+(grid[key]?1:3))%4; if(dir===0) y-=2; else if(dir===1) x+=2; else if(dir===2) y+=2; else x-=2; requestAnimationFrame(step); } step(); </script>
