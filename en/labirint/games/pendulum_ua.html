Подвійний маятник. Складний і непередбачуваний рух. 
<canvas id="pendulum" width="400" height="300"></canvas> <script> const canvas=document.getElementById('pendulum'); const ctx=canvas.getContext('2d'); let a1=Math.PI/2,a2=Math.PI/2,v1=0,v2=0; const g=1,l1=100,l2=100,m1=10,m2=10; function step(){ let num1=-g*(2*m1+m2)*Math.sin(a1); let num2=-m2*g*Math.sin(a1-2*a2); let num3=-2*Math.sin(a1-a2)*m2*(v2*v2*l2+v1*v1*l1*Math.cos(a1-a2)); let den=l1*(2*m1+m2-m2*Math.cos(2*a1-2*a2)); let a1a=(num1+num2+num3)/den; num1=2*Math.sin(a1-a2); num2=(v1*v1*l1*(m1+m2)+g*(m1+m2)*Math.cos(a1)+v2*v2*l2*m2*Math.cos(a1-a2)); den=l2*(2*m1+m2-m2*Math.cos(2*a1-2*a2)); let a2a=num1*num2/den; v1+=a1a; v2+=a2a; a1+=v1*0.02; a2+=v2*0.02; } function draw(){ ctx.clearRect(0,0,400,300); step(); let x1=200+l1*Math.sin(a1), y1=50+l1*Math.cos(a1); let x2=x1+l2*Math.sin(a2), y2=y1+l2*Math.cos(a2); ctx.beginPath(); ctx.moveTo(200,50); ctx.lineTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke(); ctx.beginPath(); ctx.arc(x1,y1,5,0,2*Math.PI); ctx.arc(x2,y2,5,0,2*Math.PI); ctx.fill(); requestAnimationFrame(draw); } draw(); </script>
