Правила Конвея: жизнь и смерть клеток. 
<canvas id="life" width="300" height="300"></canvas> <script> const canvas=document.getElementById('life'); const ctx=canvas.getContext('2d'); const size=50, cell=6; let grid=Array.from({length:size},()=>Array.from({length:size},()=>Math.random()>0.8?1:0)); function step(){ const newGrid=grid.map(r=>[...r]); for(let i=0;i<size;i++) for(let j=0;j<size;j++){ let neighbors=0; for(let di=-1;di<=1;di++) for(let dj=-1;dj<=1;dj++){ if(di===0&&dj===0) continue; let ni=(i+di+size)%size, nj=(j+dj+size)%size; neighbors+=grid[ni][nj]; } if(grid[i][j]&& (neighbors<2||neighbors>3)) newGrid[i][j]=0; else if(!grid[i][j]&&neighbors===3) newGrid[i][j]=1; } grid=newGrid; } function render(){ ctx.clearRect(0,0,300,300); for(let i=0;i<size;i++) for(let j=0;j<size;j++) if(grid[i][j]) ctx.fillRect(j*cell,i*cell,cell,cell); } function loop(){ step(); render(); requestAnimationFrame(loop); } loop(); </script>
