Random graph. On click, a new maze is generated. 
<canvas id="graph" width="300" height="300"></canvas> <script> const canvas=document.getElementById('graph'); const ctx=canvas.getContext('2d'); let nodes=[],edges=[]; function generate(){ nodes=Array.from({length:10},(_,i)=>({x:Math.random()*300,y:Math.random()*300})); edges=[]; for(let i=0;i<nodes.length;i++) for(let j=i+1;j<nodes.length;j++) if(Math.random()<0.2) edges.push([i,j]); } function draw(){ ctx.clearRect(0,0,300,300); ctx.beginPath(); for(let [i,j] of edges){ ctx.moveTo(nodes[i].x,nodes[i].y); ctx.lineTo(nodes[j].x,nodes[j].y); } ctx.stroke(); for(let n of nodes){ ctx.beginPath(); ctx.arc(n.x,n.y,5,0,2*Math.PI); ctx.fill(); } } canvas.addEventListener('click',()=>{ generate(); draw(); }); generate(); draw(); </script>
