Фрактальна фігура Серпінського. При кліку будується наступний рівень. 
<canvas id="sierpinski" width="300" height="300"></canvas> <script> const canvas=document.getElementById('sierpinski'); const ctx=canvas.getContext('2d'); let level=0; function triangle(x,y,size,lvl){ if(lvl===0){ ctx.moveTo(x,y); ctx.lineTo(x+size,y); ctx.lineTo(x+size/2,y-Math.sqrt(3)/2*size); ctx.closePath(); return; } size/=2; triangle(x,y,size,lvl-1); triangle(x+size,y,size,lvl-1); triangle(x+size/2,y-Math.sqrt(3)/2*size,size,lvl-1); } function draw(){ ctx.clearRect(0,0,300,300); ctx.beginPath(); triangle(10,290,280,level); ctx.stroke(); } canvas.addEventListener('click',()=>{ level++; draw(); }); draw(); </script>
