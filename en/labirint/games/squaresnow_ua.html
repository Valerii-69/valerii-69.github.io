Замість сніжинок падають маленькі квадрати — псевдофрактальна заметіль. 
<canvas id="snow" width="300" height="200"></canvas> <script> const canvas=document.getElementById("snow"); const ctx=canvas.getContext("2d"); let flakes=Array.from({length:50},()=>({x:Math.random()*300,y:Math.random()*200,s:2+Math.random()*3})); function step(){ ctx.clearRect(0,0,300,200); flakes.forEach(f=>{ ctx.fillRect(f.x,f.y,f.s,f.s); f.y+=f.s*0.3; if(f.y>200) f.y=0; }); requestAnimationFrame(step); } step(); </script>
