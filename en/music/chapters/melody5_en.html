<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Melody 5 — Maiden Dreams</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="../style.css">
<style>
body{font-family:system-ui,sans-serif;background:#fff8f0;color:#222;padding:2rem;}
.card{max-width:680px;margin:0 auto;background:rgba(255,255,255,0.8);padding:1.5rem;border-radius:12px;box-shadow:0 6px 18px rgba(0,0,0,0.08);}
h1{color:#ff3366;margin-bottom:.2rem;}
.desc{opacity:.85;margin-bottom:1rem;}
.sequence{display:flex;gap:.4rem;flex-wrap:wrap;margin:.6rem 0;}
.step{padding:.4rem .6rem;border-radius:6px;background:rgba(0,0,0,0.04);font-weight:600;}
button.play{background:#ff3366;color:white;border:none;padding:.6rem 1rem;border-radius:8px;font-size:1rem;cursor:pointer;}
footer{margin-top:1rem;font-size:.85rem;opacity:.8;}
</style>
</head>
<body>
<div class="card">
<h1>Melody 5</h1>
<p class="desc">Maiden Dreams — Three Synthesizers</p>

<div>
  <strong>Sequence (example notes):</strong>
  <div class="sequence" id="sequence">
    <div class="step">1</div><div class="step">3</div><div class="step">5</div><div class="step">7</div>
    <div class="step">5</div><div class="step">3</div><div class="step">1</div>
  </div>
</div>

<div style="margin-top:1rem;" class="control-row">
  <button class="play" id="playBtn">▶ Play</button>
  <label>Mode: 
    <select id="synthMode">
      <option value="0">Synth A</option>
      <option value="1">Synth B</option>
      <option value="2">Synth C</option>
    </select>
  </label>
  <label>Tempo: <input id="bpm" type="number" value="120" min="30" max="300" style="width:72px;"></label>
</div>

<footer>
  Simple WebAudio demo: each number → note. Valerii & AI — music lab.
</footer>
</div>

<script>
(function(){
  const seqs = [
    [1,3,5,7,5,3,1],   // Синтезатор A
    [2,4,6,8,6,4,2],   // Синтезатор B
    [1,4,7,10,7,4,1]   // Синтезатор C
  ];
  function midiToFreq(m){ return 440*Math.pow(2,(m-69)/12);}
  function valToMidi(v){ return 60+(v-1); } // C4=60

  let audioCtx = null;
  async function playSequence(){
    if(!audioCtx) audioCtx=new (window.AudioContext||window.webkitAudioContext)();
    const mode = Number(document.getElementById('synthMode').value);
    const seq = seqs[mode];
    const tempo = Number(document.getElementById('bpm').value)||120;
    const beat = 60/tempo;
    const noteDur = beat*0.9;
    const startTime = audioCtx.currentTime + 0.05;

    seq.forEach((v,i)=>{
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      const midi = valToMidi(v);
      osc.frequency.value = midiToFreq(midi);
      osc.type='sine';
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      gain.gain.setValueAtTime(0,startTime + i*beat);
      gain.gain.linearRampToValueAtTime(0.18,startTime + i*beat +0.01);
      gain.gain.linearRampToValueAtTime(0.12,startTime + i*beat + noteDur*0.6);
      gain.gain.linearRampToValueAtTime(0,startTime + i*beat + noteDur);
      osc.start(startTime + i*beat);
      osc.stop(startTime + i*beat + noteDur +0.02);
    });
  }

  document.getElementById('playBtn').addEventListener('click',async()=>{
    if(!audioCtx){audioCtx=new (window.AudioContext||window.webkitAudioContext)();}
    if(audioCtx.state==='suspended') await audioCtx.resume();
    document.getElementById('playBtn').disabled=true;
    document.getElementById('playBtn').textContent='… проигрывается';
    await playSequence();
    const seq = seqs[Number(document.getElementById('synthMode').value)];
    const total = seq.length*(60/(Number(document.getElementById('bpm').value)||120));
    setTimeout(()=>{document.getElementById('playBtn').disabled=false;document.getElementById('playBtn').textContent='▶ Проиграть';},(total+0.1)*1000);
  });
})();
</script>
</body>
</html>
