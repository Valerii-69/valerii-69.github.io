<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Visualization: Floating Bubbles Meditation</title>
<style>
body {margin:0;color:#e6eef8;font-family:Inter,Arial;overflow:hidden;background:#040615;}
.header {display:flex;gap:8px;align-items:center;padding:10px 12px;background: linear-gradient(90deg, rgba(124,58,237,0.12), rgba(6,182,212,0.03));}
.header h1 {margin:0;font-size:16px;font-weight:600;}
.header .controls {margin-left:auto;display:flex;gap:8px;align-items:center;}
button {padding:8px 10px;border-radius:8px;border:0;background:#7c3aed;color:white;font-size:0.9rem;cursor:pointer;}
button.secondary {background:#1f2937;color:#e6eef8;border:1px solid rgba(255,255,255,0.03);}
.canvas-wrap {position:relative;height:70vh;}
canvas {display:block;width:100%;height:120%;}
.ui {padding:12px;text-align:center;background:linear-gradient(180deg, rgba(255,255,255,0.01), rgba(255,255,255,0.00));display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap;}
.ui input[type=number] {padding:6px;border-radius:6px;border:none;width:80px;text-align:center;}
.status {font-size:0.9rem;color:#cfe3ff;margin-left:12px;}
.trackTitle {font-size:0.9rem;color:#eaf2ff;margin-left:10px;}
.meditateIcon {position:absolute;top:12px;right:12px;width:30px;height:30px;background:#7c3aed;border-radius:6px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:18px;color:white;}
</style>
</head>
<body>
<div class="header">
  <div>
<h1>Visualization: Floating Bubbles</h1>
<div class="small">Each bubble creates a mini-chord—now you can listen to stories in the background.</div>
</div>
<div class="controls">
<div class="status">Background: <span id="bgState">Synthesizer</span></div>
<div class="trackTitle" id="trackTitle"></div>
<button id="listenBtn">Listen to a Story</button>
<button id="stopListenBtn" class="secondary" style="display:none">Stop</button>
</div>
</div>

<div class="canvas-wrap">
<canvas id="c"></canvas>
<div class="meditateIcon" title="Meditation Mode">☯</div>
</div>

<div class="ui">
<button id="spawn">Spawn bubble</button>
<input type="number" id="autoInterval" value="500" min="50" step="50"> ms</input>
<button id="clear">Clear</button>
<button id="fullscreenBtn" title="Full screen">⛶</button></div>

<script>
/* =================== ИНИЦИАЛИЗАЦИЯ =================== */
const c=document.getElementById('c');
const ctx=c.getContext('2d');
let W,H;
function resize(){W=c.width=innerWidth;H=c.height=Math.round(innerHeight*0.7);}
resize(); addEventListener('resize',resize);
const bubbles=[];

/* =================== АУДИО =================== */
const audioCtx=new (window.AudioContext||window.webkitAudioContext)();
const synthMasterGain=audioCtx.createGain();
synthMasterGain.gain.value=1.0;
synthMasterGain.connect(audioCtx.destination);

/* =================== НОВЫЙ БЛОК: ЧТЕНИЕ JSON-РАССКАЗОВ ГОЛОСОМ =================== */
let storiesvb = null;
let currentStoryIndex = null;
let backgroundPlaying = false;
const listenBtn=document.getElementById('listenBtn');
const stopListenBtn=document.getElementById('stopListenBtn');
const bgState=document.getElementById('bgState');
const trackTitle=document.getElementById('trackTitle');
let utterance = null;

/* Загружаем JSON с рассказами */
async function loadStories(){
  try{
    const res = await fetch('stories/stories.json');
    storiesvb = await res.json();
  }catch(e){
console.warn('Failed to load JSON with stories', e);
storiesvb = [
{title:"Story 1", text:"When morning touched the water, the bubbles shone like the voices of the stars."},
{title:"Story 2", text:"Every sound dissolved into the air, leaving only the soft echo of time."}
    ];
  }
}

function pickRandomStoryIndex(){ return Math.floor(Math.random()*storiesvb.stories.length); }

function startBackgroundStories(){
  if(backgroundPlaying) return;
  if(audioCtx.state==='suspended') audioCtx.resume();
  if(!storiesvb){
    loadStories().then(startBackgroundStories);
    return;
  }

  currentStoryIndex = pickRandomStoryIndex();
  playCurrentStory();
}

function playCurrentStory(){
  const story = storiesvb.stories[currentStoryIndex];
  if(!story) return;

  utterance = new SpeechSynthesisUtterance(story.text);
  utterance.lang = 'en-EN';
  utterance.rate = 0.95;
  utterance.pitch = 1.0;
  utterance.volume = 1.0;

  utterance.onend = onStoryEnded;

  bgState.textContent='Stories (AI)';
  stopListenBtn.style.display='inline-block';
  listenBtn.style.display='none';
  trackTitle.textContent = `Current: ${story.title}`;
  backgroundPlaying = true;

  rampGain(synthMasterGain, 0.0, 0.8);
  speechSynthesis.speak(utterance);
}

function onStoryEnded(){
  if(!backgroundPlaying) return;
  currentStoryIndex = pickRandomStoryIndex();
  playCurrentStory();
}

function stopBackgroundStories(){
  if(!backgroundPlaying) return;
  backgroundPlaying = false;
  speechSynthesis.cancel();
  rampGain(synthMasterGain, 1.0, 0.8);
  bgState.textContent='Synthesizer';
  trackTitle.textContent='';
  stopListenBtn.style.display='none';
  listenBtn.style.display='inline-block';
}

listenBtn.addEventListener('click',()=>startBackgroundStories());
stopListenBtn.addEventListener('click',()=>stopBackgroundStories());

function rampGain(gainNode,target,time=0.6){
  const now=audioCtx.currentTime;
  gainNode.gain.cancelScheduledValues(now);
  gainNode.gain.setValueAtTime(gainNode.gain.value,now);
  gainNode.gain.linearRampToValueAtTime(target,now+time);
}

/* =================== СИНТЕЗАТОР =================== */
function playPolyphonicPhrase(b){
  if(backgroundPlaying) return null;
  const baseFreq=65.4;
  const octave=b.r<18?2+Math.random():1+Math.random();
  const root=baseFreq*Math.pow(2,octave);
  const intervals=[1,5/4,3/2];
  const now=audioCtx.currentTime;
  intervals.forEach((ratio,i)=>{
    const freq=root*ratio*(1+(Math.random()-0.5)*0.05);
    const osc=audioCtx.createOscillator();
    const gain=audioCtx.createGain();
    const pan=audioCtx.createStereoPanner();
    osc.type=["sine","triangle","sine"][i%3];
    osc.frequency.value=freq;
    pan.pan.value=(b.x/W)*2-1;
    const start=now+i*0.05;
    const end=start+2.0+Math.random()*0.8;
    osc.connect(gain).connect(pan).connect(synthMasterGain);
    gain.gain.setValueAtTime(0.001,start);
    gain.gain.exponentialRampToValueAtTime(0.15,start+0.2);
    gain.gain.exponentialRampToValueAtTime(0.002,end);
    osc.start(start); osc.stop(end);
  });
  return root;
}

/* =================== ПУЗЫРИ =================== */
let globalHue=230,targetHue=230;
function spawn(x,y){
  const r=8+Math.random()*28;
  const bubble={x:x||Math.random()*W,y:y||H+20,r,vy:-1-Math.random()*2,alpha:0.9,hue:220+(r/36)*100,pulse:0};
  bubbles.push(bubble);
  const freq=playPolyphonicPhrase(bubble);
  if(freq) targetHue=180+Math.min(100,(freq/400)*100);
}

/* =================== АВТО-СПАУН =================== */
let autoSpawnTimer=null;
const spawnBtn=document.getElementById('spawn');
spawnBtn.addEventListener('click',()=>{
  if(autoSpawnTimer){ clearInterval(autoSpawnTimer); autoSpawnTimer=null; spawnBtn.textContent='Create a bubble'; }
  else{ const interval=parseInt(document.getElementById('autoInterval').value,10)||500;
    autoSpawnTimer=setInterval(spawn,interval);
    spawnBtn.textContent='Stop auto-spawn'; }
});
document.getElementById('clear').addEventListener('click',()=>bubbles.length=0);
addEventListener('pointerdown',e=>spawn(e.clientX,e.clientY));

/* =================== FULLSCREEN =================== */
document.getElementById('fullscreenBtn').addEventListener('click',()=>{
  if(document.fullscreenElement){document.exitFullscreen();}
  else{document.documentElement.requestFullscreen();}
});

/* =================== МЕДИТАЦИЯ =================== */
const meditateIcon=document.querySelector('.meditateIcon');
let meditationMode=false;
function enterMeditation(){meditationMode=true;document.querySelector('.header').style.display='none';document.querySelector('.ui').style.display='none';meditateIcon.style.display='none';}
function exitMeditation(){meditationMode=false;document.querySelector('.header').style.display='flex';document.querySelector('.ui').style.display='flex';meditateIcon.style.display='flex';}
meditateIcon.addEventListener('click',enterMeditation);
document.addEventListener('keydown',(e)=>{if(e.key==='Escape'&&meditationMode)exitMeditation();});

/* =================== РИСОВАНИЕ =================== */
function draw(){
  globalHue += (targetHue-globalHue)*0.02;
  ctx.fillStyle=`hsl(${globalHue},40%,6%)`;
  ctx.fillRect(0,0,W,H);
  for(let b of bubbles){
    b.y+=b.vy;
    b.vy*=0.995;
    b.alpha*=0.998;
    b.pulse+=0.02;
    const r2=b.r+Math.sin(b.pulse)*1.5;
    const grad=ctx.createRadialGradient(b.x,b.y,0,b.x,b.y,r2*1.6);
    grad.addColorStop(0,`hsla(${b.hue},90%,75%,${b.alpha})`);
    grad.addColorStop(1,`hsla(${b.hue+40},90%,20%,0)`);
    ctx.beginPath();ctx.fillStyle=grad;ctx.arc(b.x,b.y,r2,0,Math.PI*2);ctx.fill();
  }
  for(let i=bubbles.length-1;i>=0;i--){if(bubbles[i].y+bubbles[i].r<-50||bubbles[i].alpha<0.02)bubbles.splice(i,1);}
  requestAnimationFrame(draw);
}
draw();
</script>
</body>
</html>
