<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Stereo Fractal Visualizer</title>
<style>

<body>
<div>

</div>

<!-- Панель чувствительности полос -->
<div id="sensitivityPanel" style="
position: fixed;
top: 10px;

padding: 12px;
border-radius: 8px;

font-family: sans-serif;

"><div>Чувствительность полос</div>

style="width: 100%; margin-top: 10px;">

<!-- Панель выбора источника аудио (старый Mic / новый Line-In/Mic) -->
<div id="audioSourcePanel" style="
position: fixed;
top: 90px;
right: 10px;

">

<div style="margin-top: 6px;">

<input type="radio" name="audioSource" id="audioSourceOld" value="old" checked>

<input type="radio" name="audioSource" id="audioSourceNew" value="new">
Line-In / Mic (AudioInputManager)

<!-- Панель режима визуализации -->
<div id="modePanel" style="
position: fixed;
top: 150px;
right: 10px;
background: rgba(0,0,0,0.6);
padding: 12px;
border-radius: 8px;
color: white;
font-family: sans-serif;
z-index: 9999;
">
<div>Режим визуализации</div>
<select id="modeSelector" style="width: 100%; margin-top: 6px;">
<option value="audio">Только аудио</option>
<option value="lissajous">Только Лисажу</option>
<option value="mix" selected>Смешивание</option>
</select>
</div>

<!-- Панель управления аудио-входом (для нового режима Line-In/Mic) -->
<div id="audio-input-panel" style="
position: fixed;
top: 220px;
right: 10px;
background: rgba(0,0,0,0.6);
padding:8px;
border-radius: 8px;
color:white;
font-family: sans-serif;
z-index:9999;
border:1px solid #444;
">
<div style="margin-bottom:4px;">
<label for="audio-device-select">Аудио-вход:</label>
<select id="audio-device-select" style="margin-left:4px; max-width:160px;">
<option value="">Загрузка устройств...</option>
</select>
</div>
<div style="margin-bottom:6px;">
<button id="audio-start-stop-btn">Старт</button>
</div>
<div style="margin-top:4px;">
<span>Уровень сигнала:</span>
<div style="background:#222;width:200px;height:10px;display:inline-block;margin-left:8px;vertical-align:middle;">
<div id="audio-level-bar" style="background:#0f0;width:0%;height:100%;"></div>
</div>
<span id="audio-level-text" style="margin-left:6px;font-size:12px;color:#ccc;">0%</span>
</div>
<div id="audio-status" style="margin-top:4px;font-size:11px;color:#aaa;"></div>
</div>

</div>

<script>
// ------------------------------------------------------------
// БАЗОВЫЕ НАСТРОЙКИ И ГЛОБАЛЬНОЕ СОСТОЯНИЕ
// ------------------------------------------------------------
const canvasLeft  = document.getElementById('canvasLeft');
const canvasRight = document.getElementById('canvasRight');
const ctxLeft  = canvasLeft.getContext('2d');
const ctxRight = canvasRight.getContext('2d');


let audioInputManagerNew = null;
let useNewAudio = false;


let fractalPoints = [];
let angleY = 0;
let angleX = 0;
let angleZ = 0;
let cameraPulse = 0;
let cameraZ = 0;
let spiralAngle = 0;
let spiralRadius = 0;
let m = 0;
let zone_t = 0;
let renderMode = "mix"; // "audio", "lissajous", "mix"

const eyeSeparation = 0.065;   // разница углов между глазами

// Режим источника аудио: "old" (старый Mic) или "new" (Line-In/Mic)
let audioSourceMode = "old";

// ------------------------------------------------------------
// ЧУВСТВИТЕЛЬНОСТЬ ПОЛОС
// ------------------------------------------------------------
const sensitivity = [1, 1, 1, 1, 1];

function setSensitivity(band, value) {
sensitivity[band] = value;
console.log("Sensitivity:", sensitivity);
}

const bandSelector = document.getElementById("bandSelector");
const gainSlider = document.getElementById("gainSlider");
const gainValue = document.getElementById("gainValue");

gainSlider.addEventListener("input", () => {
const band = Number(bandSelector.value);
const value = Number(gainSlider.value);
setSensitivity(band, value);
gainValue.textContent = "x" + value.toFixed(1);
});

// ------------------------------------------------------------
// ВЫБОР РЕЖИМА ВИЗУАЛИЗАЦИИ
// ------------------------------------------------------------
const modeSelector = document.getElementById("modeSelector");
modeSelector.addEventListener("change", () => {
renderMode = modeSelector.value;
console.log("Render mode:", renderMode);
});

// ------------------------------------------------------------
// ВЫБОР ИСТОЧНИКА АУДИО (RADIO)
// ------------------------------------------------------------
const audioSourceOldRadio = document.getElementById("audioSourceOld");
const audioSourceNewRadio = document.getElementById("audioSourceNew");

// ------------------------------------------------------------
// СТАРЫЙ АУДИО-ДВИЖОК (Mic через initAudio + getFiveBandsOld)
// ------------------------------------------------------------
let audioCtxOld = null;
let analyserOld = null;
let fftDataOld = null;
let oldStream = null;

async function initAudioOld() {
if (audioCtxOld) {
// уже инициализирован
return;
}

try {
audioCtxOld = new (window.AudioContext || window.webkitAudioContext)();
const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
oldStream = stream;
const source = audioCtxOld.createMediaStreamSource(stream);

analyserOld = audioCtxOld.createAnalyser();
analyserOld.fftSize = 512;
fftDataOld = new Uint8Array(analyserOld.frequencyBinCount);

source.connect(analyserOld);
console.log("Old audio init (Mic)");
} catch (e) {
console.error("Ошибка initAudioOld:", e);
}
}

function stopAudioOld() {
if (oldStream) {
oldStream.getTracks().forEach(t => t.stop());
oldStream = null;
}
analyserOld = null;
fftDataOld = null;

if (audioCtxOld) {
audioCtxOld.close();
audioCtxOld = null;
}
console.log("Old audio stopped.");
}

function getFiveBandsOld() {
if (!analyserOld || !fftDataOld || !audioCtxOld) {
return [
{ amp: 0, freq: 0 },
{ amp: 0, freq: 0 },
{ amp: 0, freq: 0 },
{ amp: 0, freq: 0 },
{ amp: 0, freq: 0 },
];
}

analyserOld.getByteFrequencyData(fftDataOld);

const bands = [];
const bandSize = Math.floor(fftDataOld.length / 5);
const nyquist = audioCtxOld.sampleRate / 2;

for (let i = 0; i < 5; i++) {
let sum = 0;
let maxAmp = 0;
let maxIndex = 0;
for (let j = 0; j < bandSize; j++) {
const idx = i * bandSize + j;
const v = fftDataOld[idx];
sum += v;
if (v > maxAmp) {
maxAmp = v;
maxIndex = j;
}
}
const avg = sum / bandSize;
const freq = ((i * bandSize + maxIndex) / fftDataOld.length) * nyquist;
bands.push({ amp: avg * sensitivity[i], freq: freq });
}
return bands;
}

// ------------------------------------------------------------
// НОВЫЙ АУДИО-ДВИЖОК (AudioInputManager, Line-In/Mic)
// ------------------------------------------------------------

// Здесь мы будем хранить последние 5 полос,
// рассчитанные на основе данных нового анализатора.
let lastBandsNew = [
{ amp: 0, freq: 0 },
{ amp: 0, freq: 0 },
{ amp: 0, freq: 0 },
{ amp: 0, freq: 0 },
{ amp: 0, freq: 0 },
];

function updateBandsFromDataArrayNew(dataArray, sampleRate) {
if (!dataArray || dataArray.length  === 0 || !sampleRate) {
return;
}

const bands = [];
const bandSize = Math.floor(dataArray.length / 5);
const nyquist = sampleRate / 2;

for (let i = 0; i < 5; i++) {
let sum = 0;
let maxAmp = 0;
let maxIndex = 0;

for (let j = 0; j < bandSize; j++) {
const idx = i * bandSize + j;
const v = dataArray[idx];
sum += v;
if (v > maxAmp) {
maxAmp = v;
maxIndex = j;
}
}

const avg = sum / bandSize;
const freq = ((i * bandSize + maxIndex) / dataArray.length) * nyquist;

bands.push({
amp: avg * sensitivity[i],
freq: freq
});
}

lastBandsNew = bands;
}

function getFiveBandsNew() {
return lastBandsNew;
}

// Общая функция, которую использует визуализация
// Выбирает источник на основании audioSourceMode
function getFiveBands() {
if (audioSourceMode === "new") {
return getFiveBandsNew();
} else {
return getFiveBandsOld();
}
}

// ==============================
// МОДУЛЬ УПРАВЛЕНИЯ АУДИО-ВХОДОМ (AudioInputManager)
// ==============================
class AudioInputManager {
// onAudioFrame: функция, которой мы передаём аудио-данные для фракталов
// options: дополнительные настройки (fftSize и т.п.)
constructor(onAudioFrame, options = {}) {
// ===== ПАРАМЕТРЫ =====
this.onAudioFrame = onAudioFrame;  // (dataArray, analyser, audioCtx) => {}
this.fftSize = options.fftSize || 1024; // степень двойки: 512, 1024, 2048...

// ===== СТЕЙТ =====
this.audioCtx = null;
this.analyser  = null;
this.source  = null;
this.stream  = null;
this.devices  = [];
this.currentDeviceId = null;
this.animationId = null;
this.isRunning = false;

// ===== ЭЛЕМЕНТЫ UI =====
this.deviceSelect = document.getElementById("audio-device-select");
this.startStopBtn = document.getElementById("audio-start-stop-btn");
this.levelBar = document.getElementById("audio-level-bar");
this.levelText = document.getElementById("audio-level-text");
this.statusEl = document.getElementById("audio-status");

if (!this.deviceSelect || !this.startStopBtn) {
console.warn("AudioInputManager: не найдены элементы UI (select или button).");
}

this._bindUI();
this._initDevices();
}

// 2 часть

    _bindUI() {
        if (this.deviceSelect) {
            this.deviceSelect.addEventListener("change", () => {
                this.currentDeviceId = this.deviceSelect.value || null;
                this._logStatus("Выбрано устройство: " + (this.deviceSelect.selectedOptions[0]?.textContent || "неизвестно"));
                if (this.isRunning) {
                    this.restart();
                }
            });
        }

        if (this.startStopBtn) {
            this.startStopBtn.addEventListener("click", () => {
                if (this.isRunning) {
                    this.stop();
                } else {
                    this.start();
                }
            });
        }
    }

    async _initDevices() {
        try {
            await navigator.mediaDevices.getUserMedia({ audio: true });
        } catch (e) {
            this._logStatus("Нет доступа к аудио-входу: " + e.message);
            return;
        }

        await this._updateDeviceList();

        if (navigator.mediaDevices && navigator.mediaDevices.addEventListener) {
            navigator.mediaDevices.addEventListener("devicechange", () => {
                this._updateDeviceList();
            });
        }
    }

    async _updateDeviceList() {
        try {
            const devices = await navigator.mediaDevices.enumerateDevices();
            this.devices = devices.filter(d => d.kind === "audioinput");

            if (!this.deviceSelect) return;

            this.deviceSelect.innerHTML = "";

            if (this.devices.length === 0) {
                const opt = document.createElement("option");
                opt.value = "";
                opt.textContent = "Нет доступных устройств";
                this.deviceSelect.appendChild(opt);
                this._logStatus("Аудио-входы не найдены.");
                return;
            }

            let autoSelectedId = null;

            this.devices.forEach((dev, index) => {
                const opt = document.createElement("option");
                opt.value = dev.deviceId;

                let label = dev.label || `Устройство ${index + 1}`;
                opt.textContent = label;

                const lower = label.toLowerCase();
                if (!autoSelectedId &&
                    (lower.includes("line") ||
                     lower.includes("линей") ||
                     lower.includes("stereo mix") ||
                     lower.includes("стерео микс"))) {
                    autoSelectedId = dev.deviceId;
                }

                this.deviceSelect.appendChild(opt);
            });

            if (this.currentDeviceId) {
                const found = this.devices.find(d => d.deviceId === this.currentDeviceId);
                if (found) {
                    this.deviceSelect.value = this.currentDeviceId;
                }
            } else if (autoSelectedId) {
                this.currentDeviceId = autoSelectedId;
                this.deviceSelect.value = autoSelectedId;
                this._logStatus("Автовыбор линейного входа: " +
                    (this.deviceSelect.selectedOptions[0]?.textContent || ""));
            } else {
                this.currentDeviceId = this.devices[0].deviceId;
                this.deviceSelect.value = this.currentDeviceId;
                this._logStatus("Выбрано первое устройство: " +
                    (this.deviceSelect.selectedOptions[0]?.textContent || ""));
            }
        } catch (e) {
            this._logStatus("Ошибка enumerateDevices: " + e.message);
        }
    }

    async start() {
        if (this.isRunning) return;

        try {
            if (!this.audioCtx) {
                this.audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            } else if (this.audioCtx.state === "suspended") {
                await this.audioCtx.resume();
            }

            const constraints = {
                audio: {
                    deviceId: this.currentDeviceId ? { exact: this.currentDeviceId } : undefined,
                    echoCancellation: false,
                    noiseSuppression: false,
                    autoGainControl: false
                }
            };

            this.stream = await navigator.mediaDevices.getUserMedia(constraints);

            this.source = this.audioCtx.createMediaStreamSource(this.stream);

            this.analyser = this.audioCtx.createAnalyser();
            this.analyser.fftSize = this.fftSize;

            this.source.connect(this.analyser);

            this.isRunning = true;
            if (this.startStopBtn) this.startStopBtn.textContent = "Стоп";
            this._logStatus("Аудио-вход запущен.");

            this._startAnimationLoop();
        } catch (e) {
            this._logStatus("Ошибка запуска: " + e.message);
        }
    }

    stop() {
        this.isRunning = false;

        if (this.startStopBtn) this.startStopBtn.textContent = "Старт";

        if (this.animationId) {
            cancelAnimationFrame(this.animationId);
            this.animationId = null;
        }

        if (this.analyser) {
            this.analyser.disconnect();
            this.analyser = null;
        }

        if (this.source) {
            this.source.disconnect();
            this.source = null;
        }

        if (this.stream) {
            this.stream.getTracks().forEach(t => t.stop());
            this.stream = null;
        }

        this._updateLevel(0);
        this._logStatus("Аудио-вход остановлен.");
    }

    async restart() {
        this.stop();
        await this.start();
    }

    _startAnimationLoop() {
        if (!this.analyser) return;

        const bufferLength = this.analyser.frequencyBinCount;
        const dataArray = new Uint8Array(bufferLength);

        const loop = () => {
            if (!this.isRunning || !this.analyser) return;

            this.analyser.getByteFrequencyData(dataArray);

            let maxVal = 0;
            for (let i = 0; i < bufferLength; i++) {
                if (dataArray[i] > maxVal) maxVal = dataArray[i];
            }
            const level = maxVal / 255;
            this._updateLevel(level);

            if (typeof this.onAudioFrame === "function") {
                this.onAudioFrame(dataArray, this.analyser, this.audioCtx);
            }

            this.animationId = requestAnimationFrame(loop);
        };

        loop();
    }

    _updateLevel(level) {
        const percent = Math.round(level * 100);

        if (this.levelBar) {
            this.levelBar.style.width = percent + "%";

            let color = "#0f0";
            if (percent > 70) color = "#ff0";
            if (percent > 90) color = "#f00";
            this.levelBar.style.backgroundColor = color;
        }

        if (this.levelText) {
            this.levelText.textContent = percent + "%";
        }
    }

    _logStatus(msg) {
        console.log("[AudioInputManager]", msg);
        if (this.statusEl) {
            const time = new Date().toLocaleTimeString();
            this.statusEl.textContent = `[${time}] ${msg}`;
        }
    }
}


// 3 часть


function switchAudioSource(mode) {
    if (mode === "old") {
        useNewAudio = false;

        if (audioInputManagerNew) {
            audioInputManagerNew.stop();
        }

        initAudioOld();
        console.log("Переключено на старый аудио-движок");
    }

    if (mode === "new") {
        useNewAudio = true;

        if (audioInputManagerNew) {
            audioInputManagerNew.start();
        }

        console.log("Переключено на новый аудио-движок");
    }
}


/* ------------------------------
   ИЗМЕНЕНИЕ РАЗМЕРА CANVAS
------------------------------ */
function resizeCanvas() {
    const dpr = window.devicePixelRatio || 1;

    const leftCanvas  = document.getElementById("canvasLeft");
    const rightCanvas = document.getElementById("canvasRight");

    if (!leftCanvas || !rightCanvas) return;

    const width  = window.innerWidth  || document.documentElement.clientWidth  || document.body.clientWidth;
    const height = window.innerHeight || document.documentElement.clientHeight || document.body.clientHeight;

    // Левый
    leftCanvas.width  = Math.floor(width / 2 * dpr);
    leftCanvas.height = Math.floor(height * dpr);
    leftCanvas.style.width  = Math.floor(width / 2) + "px";
    leftCanvas.style.height = height + "px";

    // Правый
    rightCanvas.width  = Math.floor(width / 2 * dpr);
    rightCanvas.height = Math.floor(height * dpr);
    rightCanvas.style.width  = Math.floor(width / 2) + "px";
    rightCanvas.style.height = height + "px";

    const ctxL = leftCanvas.getContext("2d");
    const ctxR = rightCanvas.getContext("2d");
    if (ctxL && ctxR) {
        ctxL.setTransform(dpr, 0, 0, dpr, 0, 0);
        ctxR.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
}


/* ------------------------------
   НОРМАЛИЗАЦИЯ ГЛУБИНЫ
------------------------------ */
function normalizeDepth(points) {
    if (!points || points.length === 0) return;

    let min = Infinity;
    let max = -Infinity;

    for (const p of points) {
        if (p.depth < min) min = p.depth;
        if (p.depth > max) max = p.depth;
    }

    const range = max - min || 1;

    for (const p of points) {
        p.depth = (p.depth - min) / range;
    }
}

/* ------------------------------
   ЛИССАЖУ ПО АУДИО
------------------------------ */
function generateAudioReactiveLissajous(m, bands) {
    const points = [];
    const A = 0.4 + bands[0].amp / 600;
    const B = 0.4 + bands[1].amp / 600;

    const a = 3 + Math.floor(bands[2].amp / 64);
    const b = 2 + Math.floor(bands[3].amp / 64);

    const count = 200;

    for (let i = 0; i < count; i++) {
        const t = (i / count) * Math.PI * 2;

        const x = A * Math.sin(a * t + m * 0.01);
        const y = B * Math.sin(b * t);

        const depth = (bands[4].amp || 0) * (0.5 + 0.5 * Math.sin(t * 3));

        points.push({
            x,
            y,
            depth,
            color: "#330000",
            size: 3 + (bands[1].amp / 255) * 4
        });
    }

    return points;
}

/* ------------------------------
   ФРАКТАЛ ПО АУДИО
------------------------------ */
function generateFractalPointsFromAudio() {
    const bands = getFiveBands();
    const points = [];

    bands.forEach((band, bandIndex) => {
        const { amp, freq } = band;
        const normAmp = amp / 255;

        const count = 5 + Math.floor(normAmp * 10);

        for (let i = 0; i < count; i++) {
            const t = i / count;
            const angle = t * Math.PI * 2 + bandIndex * 0.5;
            const radius = normAmp * (0.3 + bandIndex * 0.15);

            let x = Math.cos(angle + freq * 0.00005) * radius;
            let y = Math.sin(angle * 1.3 + freq * 0.00003) * radius;
            let depth = amp * 0.7 + freq * 0.02 + bandIndex * 5;
            let size = 2 + normAmp * 6 + bandIndex * 0.5;

            if (isNaN(x)) x = 0;
            if (isNaN(y)) y = 0;
            if (isNaN(depth)) depth = 0;
            if (isNaN(size)) size = 1;

            points.push({
                x: Number(x.toFixed(3)),
                y: Number(y.toFixed(3)),
                depth: Math.round(depth),
                color: "#3f0500",
                size: Number(size.toFixed(2))
            });
        }
    });

    return points.slice(0, 50);
}

/* ------------------------------
   ОБНОВЛЕНИЕ ДАННЫХ
------------------------------ */
async function updateData() {
    try {
        fractalPoints = generateFractalPointsFromAudio();
        normalizeDepth(fractalPoints);
    } catch (e) {
        console.error("ESP32fetcherror:", e);
    }
}

/* ------------------------------
   ОТРИСОВКА ФРАКТАЛА
------------------------------ */
function drawFractal(ctx, fractalPoints, angleY, angleX, zone_t) {
    const canvas = ctx.canvas;

    const R = 0;
    const G = 0;
    const B = 0;

    ctx.fillStyle = 'rgba(' + R + ', ' + G + ', ' + B + ', 0.1)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    const centerX = canvas.width / 2;
    const centerY = canvas.height / 2;
    const scale = Math.min(centerX, centerY) * 0.95;

    const maxDepth = Math.max(...fractalPoints.map(p => p.depth || 0), 1);

    fractalPoints.forEach(point => {
        if (!point) return;

        let px = point.x * scale;
        let py = point.y * scale;
        let pz = point.depth !== undefined ? point.depth * 0.5 : 0;

        const cosA = Math.cos(angleY);
        const sinA = Math.sin(angleY);

        const x3d = px * cosA + pz * sinA;
        const z3d = pz * cosA - px * sinA;

        const perspective = 3 / (1 + z3d * 0.0002);

        const X = centerX + x3d * perspective;
        const Y = centerY + py * perspective;

        const sizeScale = perspective;

        const t = point.depth !== undefined
            ? point.depth / maxDepth
            : Math.random();

        const zone = t * 6 * zone_t;

        const R = Math.floor(128 + 127 * Math.sin(t * Math.PI * 2));
        const G = Math.floor(128 + 127 * Math.sin(t * Math.PI * 2 + 2));
        const B = Math.floor(128 + 127 * Math.sin(t * Math.PI * 2 + 4));

                ctx.beginPath();
                ctx.fillStyle = color;
                const r = point.size * sizeScale * (1 + k * 2);

                ctx.arc((X * 0.25) + centerX / 1.25, (Y * 0.3) + centerY / 2, point.size * sizeScale, 0, Math.PI * 2);

                ctx.shadowColor = point.color;
                ctx.shadowBlur = 10;
                ctx.fill();
                ctx.shadowBlur = 0;
            }
        } catch (error) {
            console.error("err:", error.message);
        } finally {
            console.log("finish");
        }
    });

    angleY += 0.01;

    const audioPoints = fractalPoints;

    const lissajousPoints = generateAudioReactiveLissajous(m, bands);

    let finalPoints;

    if (renderMode === "audio") {
        finalPoints = audioPoints;
        zone_t = 0.5;
    }
    else if (renderMode === "lissajous") {
        finalPoints = lissajousPoints;
        zone_t = 0;
    }
    else if (renderMode === "mix") {
        const mix = Math.min(1, Math.max(0, bands[1].amp / 255));
        finalPoints = mixPoints(audioPoints, lissajousPoints, mix);
        zone_t = 0.5;
    }

    drawFractal(ctxLeft,  finalPoints, angleY - eyeSeparation, angleX - eyeSeparation, zone_t);
    drawFractal(ctxRight, finalPoints, angleY + eyeSeparation, angleX - eyeSeparation, zone_t);

    requestAnimationFrame(animate);

// 4 часть

function mixPoints(audioPoints, lissajousPoints, mix) {

    // Защита от пустых или битых массивов
    if (!Array.isArray(audioPoints) || audioPoints.length === 0) return [];
    if (!Array.isArray(lissajousPoints) || lissajousPoints.length === 0) return [];

    const result = [];

    const maxLen = Math.max(audioPoints.length, lissajousPoints.length);

    for (let i = 0; i < maxLen; i++) {
        const A = audioPoints[i % audioPoints.length];
        const L = lissajousPoints[i % lissajousPoints.length];

        // Пропускаем битые точки
        if (!A || !L) continue;
        if (typeof A.x !== "number" || typeof A.y !== "number") continue;
        if (typeof L.x !== "number" || typeof L.y !== "number") continue;
		
        result.push({
            x: A.x * (1 - mix) + L.x * mix,
            y: A.y * (1 - mix) + L.y * mix,
            depth: A.depth * (1 - mix) + L.depth * mix,
            color: mix < 0.5 ? A.color : L.color,
            size: A.size * (1 - mix) + L.size * mix
        });
    }

    return result;
}

window.addEventListener("DOMContentLoaded", () => {
	resizeCanvas();
    switchAudioSource("old");
    animate();
});
