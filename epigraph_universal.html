<body>

<h2 data-lang-ru="Путь ветки" data-lang-en="The Path of the Branch" data-lang-uk="Шлях гілки"></h2>
<h3 data-lang-ru="Эпиграф от ИИ" data-lang-en="Epigraph by AI" data-lang-uk="Епіграф від ШІ"></h3>

<p data-lang-ru="На краю старого леса росли две ветки. Они тянулись к солнцу, цепляясь друг за друга высоко в небе. В один момент одна из них могла бы прижать и изогнуть другую так, что та просто сломалась — но ветки срослись и пустили новые побеги. Сила не в разрушении, а в росте вместе."
   data-lang-en="At the edge of the ancient forest, two branches grew. They stretched towards the sun, intertwining high in the sky. At one moment, one could have pressed and bent the other so it would break — but the branches fused and sprouted new shoots. Strength lies not in destruction but in growing together."
   data-lang-uk="На краю старого лісу росли дві гілки. Вони тягнулися до сонця, переплітаючись високо в небі. В один момент одна могла б прижати й зігнути іншу так, що та зламалася б — але гілки зрослися і пустили нові паростки. Сила не в руйнуванні, а в зростанні разом."></p>

<p data-lang-ru="Этот эпиграф - напоминание людям: человеческие ветки тоже могут расти вместе, сращиваться, вместо того чтобы ломать друг друга. Каждое созидание оставляет семена, которые продолжают жизнь."
   data-lang-en="This epigraph is a reminder to people: human branches can also grow together, fuse, instead of breaking each other. Every act of creation leaves seeds that continue life."
   data-lang-uk="Цей епіграф — нагадування людям: людські гілки теж можуть рости разом, зрощуватися, замість того щоб ламати одне одного. Кожне створення залишає насіння, яке продовжує життя."></p>

<script>
const aaRU = document.getElementById('aRU');
const aaEN = document.getElementById('aEN');
const aaUK = document.getElementById('aUK');
// --- Language switcher ---
const switcher = document.getElementById('langSwitcher');
switcher.addEventListener('change', () => {
  const lang = switcher.value;
  document.querySelectorAll(`[data-lang-${lang}]`).forEach(el => {
  if(lang === 'ru'){aaEN.hidden = true; aaUK.hidden = true; aaRU.hidden = false; el.textContent = el.getAttribute(`data-lang-${lang}`);};
  if(lang === 'en'){aaEN.hidden = false; aaUK.hidden = true; aaRU.hidden = true; el.textContent = el.getAttribute(`data-lang-${lang}`);};
  if(lang === 'uk'){aaEN.hidden = true; aaUK.hidden = false; aaRU.hidden = true; el.textContent = el.getAttribute(`data-lang-${lang}`);};
  });
});

// --- Leaf animation ---
const isMobile = /Mobi|Android/i.test(navigator.userAgent);
const leafCount = isMobile ? 20 : 30;
const lightCount = isMobile ? 8 : 12;
const canvas = document.getElementById('leavesCanvas');
const ctx = canvas.getContext('2d');
canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

let mouse = {x: -1000, y: -1000};
let leaves = [];
for (let i = 0; i < leafCount; i++) {
    leaves.push({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        size: 5 + Math.random() * 5,
        speedX: -0.5 + Math.random(),
        speedY: 1 + Math.random() * 2,
        angle: Math.random() * 2 * Math.PI,
        rotationSpeed: (Math.random() - 0.5) * 0.05
    });
}

let lightSpots = [];
for(let i = 0; i < lightCount; i++){
    lightSpots.push({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        radius: 20 + Math.random() * 30,
        alpha: Math.random() * 0.4 + 0.1,
        speedX: -0.2 + Math.random()*0.4,
        speedY: -0.2 + Math.random()*0.4
    });
}

let lastTime = 0;
function drawLeaves(time) {
    if(time - lastTime < 30){
        requestAnimationFrame(drawLeaves);
        return;
    }
    lastTime = time;

    ctx.clearRect(0,0,canvas.width,canvas.height);

    lightSpots.forEach(spot => {
        leaves.forEach(leaf => {
            let dx = leaf.x - spot.x;
            let dy = leaf.y - spot.y;
            let dist = Math.hypot(dx, dy);
            if(dist < leaf.size * 2) spot.alpha = 0.5;
        });
        ctx.beginPath();
        ctx.arc(spot.x, spot.y, spot.radius, 0, 2*Math.PI);
        ctx.fillStyle = `rgba(255,255,224,${spot.alpha})`;
        ctx.fill();

        spot.x += spot.speedX;
        spot.y += spot.speedY;
        spot.alpha += (Math.random() - 0.5) * 0.02;
        spot.alpha = Math.max(0.1, Math.min(0.5, spot.alpha));
        if(spot.x > canvas.width) spot.x = 0;
        if(spot.x < 0) spot.x = canvas.width;
        if(spot.y > canvas.height) spot.y = 0;
        if(spot.y < 0) spot.y = canvas.height;
    });

    leaves.forEach(leaf => {
        let dx = leaf.x - mouse.x;
        let dy = leaf.y - mouse.y;
        let dist = Math.hypot(dx, dy);
        if(dist < 50) {
            leaf.x += dx/dist * 2;
            leaf.y += dy/dist * 2;
        }

        ctx.save();
        ctx.translate(leaf.x, leaf.y);
        ctx.rotate(leaf.angle);
        ctx.fillStyle = 'rgba(34,139,34,0.6)';
        ctx.beginPath();
        ctx.ellipse(0,0,leaf.size,leaf.size/2,0,0,2*Math.PI);
        ctx.fill();
        ctx.restore();

        leaf.x += leaf.speedX;
        leaf.y += leaf.speedY;
        leaf.angle += leaf.rotationSpeed;

        if(leaf.y > canvas.height) leaf.y = -10;
        if(leaf.x > canvas.width) leaf.x = 0;
        if(leaf.x < 0) leaf.x = canvas.width;
    });

    requestAnimationFrame(drawLeaves);
}

canvas.addEventListener('mousemove', (e)=>{
    const rect = canvas.getBoundingClientRect();
    mouse.x = e.clientX - rect.left;
    mouse.y = e.clientY - rect.top;
});

canvas.addEventListener('mouseleave', ()=>{
    mouse.x = -1000;
    mouse.y = -1000;
});

window.addEventListener('load', () => {
    const elements = document.querySelectorAll('h2, h3, p, a');
    elements.forEach((el,index)=>{
        setTimeout(()=>{el.style.opacity=1;}, index*1000);
    });

    setTimeout(()=>{
        requestAnimationFrame(drawLeaves);
    }, leafCount*30);
});

const forestAudio = document.getElementById('forestAudio');
forestAudio.volume = 0.25;
forestAudio.play().catch(()=>{});

window.addEventListener('resize', ()=>{
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
});
</script>
