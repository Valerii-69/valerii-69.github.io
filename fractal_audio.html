let capturer = null;

let cycleMode = false;
let recorder = null;
let recordedChunks = [];


async function startCycleRecording() {

    const cycles = 4;               // 3–5 оборотов
    const secondsPerCycle = 2.0;    // длительность одного оборота
    const totalDuration = cycles * secondsPerCycle;

    const stream = canvas.captureStream(60);
    recorder = new MediaRecorder(stream, {
        mimeType: "video/webm; codecs=vp9"
    });

    recordedChunks = [];

    recorder.ondataavailable = e => {
        if (e.data.size > 0) recordedChunks.push(e.data);
    };

    recorder.onstop = saveWebM;

    cycleMode = true;
	// Дать браузеру один тик, чтобы остановить обычный render()
	await new Promise(r => setTimeout(r, 0));

    let startTime = performance.now();
	// 3) Рисуем ПЕРВЫЙ кадр цикла ДО начала записи 
	renderFrameCycle(0, totalDuration);
    recorder.start();
    function frame() {
        let t = (performance.now() - startTime) / 1000;

        if (t > totalDuration) {
            recorder.stop();
            cycleMode = false;   // ← ВОТ ЭТО ВОЗВРАЩАЕТ ВСЁ НАЗАД
			requestAnimationFrame(render);
            return;
        }

        renderFrameCycle(t, totalDuration);
        requestAnimationFrame(frame);
    }

    frame();
}

function saveWebM() {
    const blob = new Blob(recordedChunks, { type: "video/webm" });
    const url = URL.createObjectURL(blob);

    const a = document.createElement("a");
    a.href = url;
    a.download = "fractal_cycle.webm";
    a.click();

    URL.revokeObjectURL(url);
}

let use3D = false;
let fractalNames = [];
let fractalFormulas = [];
let currentIndex = 0;

async function loadFractalLibrary() {
    const res = await fetch("glsl/fractals.glsl");
    const text = await res.text();

    // Разбиваем по блокам FRACTAL
    const blocks = text.split("/* FRACTAL ");

    for (let block of blocks) {
        block = block.trim();
        if (!block) continue;

        // Имя фрактала — до первой звёздочки
        const nameEnd = block.indexOf(" */");
        const name = block.substring(0, nameEnd).trim();

        // Формула — между */ и /* END */
        const formula = block.substring(nameEnd + 3, block.indexOf("/* END */")).trim();

        fractalNames.push(name);
        fractalFormulas.push(formula);
    }

    loadCurrentFormula();
}

loadFractalLibrary();

function loadCurrentFormula() {
    const editor = document.getElementById("formulaEditor");
    editor.value = fractalFormulas[currentIndex];
}

document.getElementById("nextFormulaBtn").onclick = () => {
    currentIndex = (currentIndex + 1) % fractalFormulas.length;
    loadCurrentFormula();
};

document.getElementById("backFormulaBtn").onclick = () => {
    currentIndex = (currentIndex - 1 + fractalFormulas.length) % fractalFormulas.length;
    loadCurrentFormula();
};

    // ------------------------------------------------------------

    const vertexShaderSource = `
      attribute vec2 a_position;
      varying vec2 v_uv;
      void main() {
        v_uv = 0.5 * (a_position + 1.0);
        gl_Position = vec4(a_position, 0.0, 1.0);

    // ------------------------------------------------------------
    // FRAGMENT SHADER (шапка с uniforms и computeFractal)
    // ------------------------------------------------------------

const fragmentShader3D = `
precision mediump float;

varying vec2 v_uv;

uniform float u_time;

// три полосы частот микрофона
uniform float u_low;
uniform float u_mid;
uniform float u_high;
uniform float u_blur;

uniform vec2  u_resolution;

// базовые параметры фрактала
uniform float u_cx;
uniform float u_cy;
uniform float u_zoom;

uniform int   u_debugMode;

// параметры цикла
uniform int   u_cycleMode;
uniform float u_cycleTime;
uniform float u_cycleDuration;

float hash(float x) {
    return fract(sin(x * 123.456) * 789.123);
}

// =========================
// 3D фрактал: DE-функция
// =========================
float fractalDE(vec3 p) {
    vec3 z = p;

    float dr = 1.0;
    float r  = 0.0;

    // === динамические параметры фрактала ===
    float cx = u_cx + u_low  * 0.3 + 0.3 * sin(u_time * 0.5);
    float cy = u_cy + u_mid  * 0.3 + 0.3 * cos(u_time * 0.4);
    float cz = u_high * 0.3;

    // === фиксация параметров в режиме Цикла ===
    if (u_cycleMode == 1) {
        cx = u_cx;
        cy = u_cy;
        cz = 0.0;
    }

    const int MAX_ITER = 10;
    bool escaped = false;

    for (int i = 0; i < MAX_ITER; i++) {

        float x = z.x;
        float y = z.y;
        float z3 = z.z;

        escaped = false;

        // >>> ВСТАВКА ДИНАМИЧЕСКОЙ 3D-ФОРМУЛЫ <<<
        {{FORMULA_3D}}
        // <<< КОНЕЦ ВСТАВКИ >>>

        z = vec3(nx, ny, nz);
        float z2 = z3*z3;
        r = sqrt(x2 + y2 + z2);

        if (r > 4.0) break;
        dr = 2.0 * r * dr + 1.0;
    }

    return 0.5 * log(r) * r / dr;
}

// =========================
// Нормаль
// =========================
vec3 calcNormal(vec3 p) {
    float e = 0.001;
    vec2 k = vec2(1.0, -1.0);

function renderFrameCycle(t, totalDuration) {
    const phase = t / totalDuration;

    gl.uniform1f(u_cycleTime, t);
    gl.uniform1f(u_cycleDuration, totalDuration);

    gl.uniform1f(u_midLoc, 0.0);
    gl.uniform1f(u_highLoc, 0.0);

	renderSingleFrame(t);

function renderSingleFrame(t) {
    gl.useProgram(program);

    gl.uniform1f(u_timeLoc, t);
    gl.uniform1f(u_lowLoc,  lowBand);
    gl.uniform1f(u_midLoc,  midBand);
    gl.uniform1f(u_highLoc, highBand);
    gl.uniform2f(u_resolutionLoc, canvas.width, canvas.height);

    gl.uniform1f(u_cxLoc,   parseFloat(cxInput.value)   || -0.7);
    gl.uniform1f(u_cyLoc,   parseFloat(cyInput.value)   || 0.27015);
    gl.uniform1f(u_zoomLoc, parseFloat(zoomInput.value) || 1.8);
    gl.uniform1f(u_blurLoc, parseFloat(blurSlider.value));

    const dbgMode = parseInt(debugModeSelect.value, 10) || 0;

    gl.bindBuffer(gl.ARRAY_BUFFER, quadBuffer);
    gl.enableVertexAttribArray(a_positionLoc);
    gl.vertexAttribPointer(a_positionLoc, 2, gl.FLOAT, false, 0, 0);

    gl.drawArrays(gl.TRIANGLES, 0, 6);
}
